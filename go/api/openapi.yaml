            途中のプロキシが応答の `ETag` に `W/` を付けることがあります。`W/` の付いた値のまま送っても、付いていない値と同じに照合します。
            省略すると428を返します。
          schema:
            type: string
      responses:
        "204":
          description: 下書きを削除しました。
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages/{page_number}/draft_page/body_edits:
    post:
      operationId: createDraftPageBodyEdit
      summary: 下書きの本文を検索置換する
      description: |
        ページ番号で指定したページについて、トークンの持ち主の下書きの本文に、`edits` の編集を配列の順に適用し、更新した下書きを返します。
        各編集は、前の編集を適用した後の本文で `old_str` に一致する箇所を `new_str` に置き換えます。
        `old_str` は大文字小文字・空白も含めて完全に一致する必要があり、`replace_all` が `false` (既定) の編集は一致がちょうど1件でなければなりません。
        1件でも適用できない編集があれば、どの編集も適用せずに422を返します。
        各編集を適用した後の本文は、UTF-8で1,048,576バイト (1MiB) 以下である必要があります。途中の編集で上限を超える場合も、どの編集も適用せずに422を返します。
        本文の改行コード (CRLF) は、`old_str`・`new_str` と同じLFとして照合し、更新した本文の改行コードはLFになります。
        置換した後の本文は `updateDraftPage` と同じく保存し、Web画面での手動保存と同じく下書きの編集履歴を1件作ります。直前の編集履歴と同じ内容なら作りません。
        ページは公開せず、公開済みのページの内容も変えません。
        本文のWikiリンクが存在しないページを指す場合は、Web画面での下書きの保存と同じく、リンク先のページを未公開の状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。
        置換しても本文が変わらない場合は下書きを書き換えず、`ETag` も変わりません。
        応答の `Content-Location` ヘッダーは更新した下書きのURL、`ETag` ヘッダーは `getDraftPage` と同じ値です。

        長い下書きの一部だけを書き換えるときに使います。本文の全体を送り直す `updateDraftPage` と違い、変えない部分を送らずに済みます。
        タイトルを変えるには `updateDraftPage` を使います。下書きがまだ無いページでは `createDraftPage` で作成してください。
        `old_str` を決めるには、本文を読む必要があります。`getDraftPage` で今の本文を読み、置き換えたい箇所を、本文の中で1か所に決まる長さで `old_str` に指定してください。

        `If-Match` ヘッダーは任意です。
        `old_str` が今の本文に一致すること自体が、読んだ本文を前提にしていることの確かめになるため、省略しても他の変更を気付かずに上書きしません。
        省略すると、`getDraftPage` で読んだ後に関係のない箇所が更新されていても (利用者がWeb画面で同じ下書きを編集していても) 置換できます。
        読んだ版のままの本文にだけ適用したい場合は、`getDraftPage` の `ETag` を `If-Match` ヘッダーで送ってください。

        非公開トピックのページの下書きを更新するには、トークンが `draft_page:write` に加えて `topic:read` を持つ必要があります。

        失敗したときは、次のように対処してください。

        - 422 (`edits/{位置}/old_str`): その位置 (0始まり) の編集の `old_str` が、前の編集を適用した後の本文に一致しないか、`replace_all` が `false` なのに複数の箇所に一致します。`errors` の `detail` で一致の件数を確かめ、`getDraftPage` で今の本文を読んで `old_str` を直してください。どの編集も適用していないため、直した後は `edits` の全体を送り直してください
        - 422 (`edits/{位置}/new_str`): その編集後の本文が1,048,576バイトを超えます。どの編集も適用していません。各編集の途中結果も上限以下に収まるように、編集する内容を減らしてください
        - 412: `If-Match` を送った場合に、読んだ後に下書きが更新されています。`getDraftPage` で取得し直し、今の本文で `old_str` を確かめてから送り直してください
        - 403: トークンが `draft_page:write` を持たないか、トークンの持ち主に下書きの保存権限がありません
        - 404: ページが存在しないか、ページにトークンの持ち主の下書きが無いか、ページがゴミ箱に入っているか、トークンの持ち主またはトークンが所属トピックを閲覧できません。下書きが無い場合は `createDraftPage` で作成してください
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: false
        confirmation_required: false
      tags:
        - draft_page_body_edit
      security:
        - oauth2:
            - draft_page:write
        - personalAccessToken:
            - draft_page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-Match
          in: header
          required: false
          description: |
            置換の前提にする下書きの `ETag` です。送った場合は、下書きの今の `ETag` と一致する場合だけ置換します。
            途中のプロキシが応答の `ETag` に `W/` を付けることがあります。`W/` の付いた値のまま送っても、付いていない値と同じに照合します。
            省略すると版を照合せず、今の本文に置換を適用します。
          schema:
            type: string
      requestBody:
        description: 本文に順に適用する編集です。
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBodyEdit"
      responses:
        "200":
          description: 更新した下書き
          headers:
            Content-Location:
              description: "更新した下書きのURLです (例: `/api/v1/spaces/seed-wiki/pages/42/draft_page`)。"
              required: true
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages/{page_number}/draft_page/publication:
    post:
      operationId: createDraftPagePublication
      summary: 下書きを公開する
      description: |
        ページ番号で指定したページについて、トークンの持ち主の下書きのタイトルと本文でページを公開し、公開したページを返します。
        公開すると、Web画面での公開と同じく、下書きを編集履歴ごと削除し、ページの編集履歴を1件作ります。
        まだ公開していないページ (`status` が `unpublished`) は公開済みになります。
        本文のWikiリンクが存在しないページを指す場合は、Web画面での公開と同じく、リンク先のページを未公開の状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。
        リクエスト本文はありません。
        応答の `Content-Location` ヘッダーは公開したページのURL、`ETag` ヘッダーは `getPage` と同じ値です。

        `createDraftPage` や `updateDraftPage` で書いた下書きを、ページに反映するときに使います。
        公開の前に `getDraftPage` で下書きを取得して内容を確かめ、応答の `ETag` を `If-Match` ヘッダーで送ってください。
        利用者がWeb画面で同じ下書きを編集している場合は412になり、確かめていない内容を公開しません。
        ページの今の内容とは照合しないため、下書きを作った後にページが更新されていても、下書きの内容で上書きします。
        `If-Match: *` は下書きが存在すれば版を問わず一致するため、確かめた内容だけを公開するには、取得した具体的な `ETag` を指定してください。

        下書きを公開するには、トークンが `draft_page:write` と `page:write` の両方を持つ必要があります。
        非公開トピックのページの下書きを公開するには、トークンが `topic:read` も持つ必要があります。

        失敗したときは、次のように対処してください。

        - 428: `If-Match` ヘッダーがありません。`getDraftPage` で内容と `ETag` を確かめてから送り直してください
        - 412: 取得した後に下書きが更新されています。`getDraftPage` で今の内容を確かめ、公開してよければ新しい `ETag` で公開し直してください
        - 422 (`title`): 下書きにタイトルが無いか、タイトルに使えない文字があるか、同じタイトルのページがトピックにあります。`errors` の `detail` を確かめ、`updateDraftPage` で下書きのタイトルを直してから公開し直してください
        - 403: トークンが `draft_page:write` と `page:write` の両方を持つか、トークンの持ち主に下書きを保存しページを公開する権限があるかを確かめてください
        - 404: ページが存在しないか、ページにトークンの持ち主の下書きが無いか、ページがゴミ箱に入っているか、トークンの持ち主が所属トピックを閲覧できません。公開し直して404になった場合は、公開済みか下書きが削除されています。`getPage` でページを確かめてください
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: true
        confirmation_required: true
      tags:
        - draft_page_publication
      security:
        - oauth2:
            - draft_page:write
            - page:write
        - personalAccessToken:
            - draft_page:write
            - page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-Match
          in: header
          required: false
          description: |
            公開の前提にする下書きの `ETag` です。下書きの今の `ETag` と一致する場合だけ公開します。
            途中のプロキシが応答の `ETag` に `W/` を付けることがあります。`W/` の付いた値のまま送っても、付いていない値と同じに照合します。
            省略すると428を返します。
          schema:
            type: string
      responses:
        "200":
          description: 公開したページ
          headers:
            Content-Location:
              description: "公開したページのURLです (例: `/api/v1/spaces/seed-wiki/pages/42`)。"
              required: true
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages/{page_number}/draft_page_revisions:
    get:
      operationId: listDraftPageRevisions
      summary: 下書きの編集履歴を取得する
      description: |
        ページ番号で指定したページについて、トークンの持ち主の下書きの編集履歴 (リビジョン) を、本文を含めて作成日時の新しい順に返します。
        リビジョンは下書きのある時点のタイトルと本文の記録で、下書きの作成・更新と、Web画面での手動保存や復元のときに作られます。
        Web画面の自動保存ではリビジョンを作らないため、先頭のリビジョンが今の下書きと同じ内容とは限りません。
        下書きを公開または削除すると、編集履歴も削除されます。

        下書きを以前の内容と比べるときや、書き換える前の内容を探すときに使います。
        1件のリビジョンを読むには `getDraftPageRevision` を、今の下書きを読むには `getDraftPage` を使います。

        非公開トピックのページの下書きの編集履歴を読むには、トークンが `draft_page:read` に加えて `topic:read` を持つ必要があります。

        一覧はカーソル方式で分割して返します。
        続きがある場合は、本文の `next_cursor` と `Link` ヘッダー (`rel="next"`) で次のページを示します。
        続きが無い場合は `next_cursor` が `null` になり、`Link` ヘッダーは付きません。

        ページが存在しない場合、ページにトークンの持ち主の下書きが無い場合、ページがゴミ箱に入っている場合、見られない非公開トピックのページの場合は404を返します。
        404を受け取ったら、`listDraftPages` で下書きのあるページの番号を確かめてください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - draft_page_revision
      security:
        - oauth2:
            - draft_page:read
        - personalAccessToken:
            - draft_page:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 下書きの編集履歴
          headers:
            Link:
              $ref: "#/components/headers/Link"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPageRevisionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages/{page_number}/draft_page_revisions/{draft_page_revision_id}:
    get:
      operationId: getDraftPageRevision
      summary: 下書きのリビジョンを取得する
      description: |
        ページ番号とリビジョンのIDで指定した、トークンの持ち主の下書きのリビジョンを本文を含めて返します。

        `listDraftPageRevisions` で見つけたリビジョンの内容を読むときに使います。
        リビジョンのIDは `listDraftPageRevisions` の応答の `id` です。

        非公開トピックのページの下書きのリビジョンを読むには、トークンが `draft_page:read` に加えて `topic:read` を持つ必要があります。

        リビジョンがパスのページの下書きのものでない場合も404を返します。
        404を受け取ったら、`listDraftPageRevisions` でそのページの下書きのリビジョンのIDを確かめてください。
        下書きを公開または削除した後は、編集履歴も削除されているため404になります。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - draft_page_revision
      security:
        - oauth2:
            - draft_page:read
        - personalAccessToken:
            - draft_page:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/DraftPageRevisionID"
      responses:
        "200":
          description: 下書きのリビジョン
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPageRevision"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/attachments/{attachment_id}:
    get:
      operationId: getAttachment
      summary: 添付ファイルを取得する
      description: |
        IDで指定した添付ファイルのファイル名・種類・バイト数と、中身をダウンロードする署名付きURLを返します。

        ページの本文に含まれる図やスクリーンショットなどの中身を確かめるときに使います。
        本文は添付ファイルを `/attachments/{ID}` のパス (例: `![図](/attachments/01234567-89ab-cdef-0123-456789abcdef)`) で参照しており、`attachment_id` にはそのIDを渡します。

        中身は応答の `download_url` に `GET` を送って取得します。
        `download_url` はオブジェクトストレージの署名付きURLで、URL自体が取得の権限を持つため、`Authorization` ヘッダーのトークンを付けずに要求してください。
        `download_url` は `download_url_expires_at` を過ぎると使えなくなります (発行から5分)。
        期限が切れたら、このoperationを呼び直して新しいURLを受け取ってください。

        `attachment:read` を持つトークンは、非公開トピックのページが参照する添付ファイルも取得できます。

        別のスペースの添付ファイルや存在しない添付ファイルには404を返します。
        404を受け取ったら、本文の `/attachments/{ID}` のIDと、トークンが属するスペースを確かめてください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - attachment
      security:
        - oauth2:
            - attachment:read
        - personalAccessToken:
            - attachment:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: 添付ファイルの情報と署名付きURL
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /openapi.yaml:
    get:
      operationId: getOpenAPIDescription
      summary: OpenAPI記述を取得する
      description: |
        このAPIのOpenAPI記述をYAMLで返します。

        使えるoperation・パラメーター・応答の形を機械的に調べるときに使います。
        トークンは要りません。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - openapi
      security: []
      responses:
        "200":
          description: OpenAPI記述
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/UnexpectedError"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        OAuth 2.0のAuthorization Code + PKCE (S256) で取得したアクセストークンです。
        トークンは、OAuthアプリを登録したスペースに属します。
        全スペース共通の公式クライアントは、認可要求の `resource` パラメーターでスペースのAPIのURL (例: `https://example.com/api/v1/spaces/{space_identifier}`) を指定し、そのスペースに属するトークンを受け取ります。
        アクセストークンの有効期間は1時間で、リフレッシュトークンで更新できます。
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            topic:read: トピックを読む。非公開トピックとそのページを読むにもこのスコープが要ります
            page:read: ページを読む
            page:write: ページを作成・更新する (`page:read` を含みます)
            draft_page:read: 自分の下書きと編集履歴を読む
            draft_page:write: 自分の下書きを作成・更新する (`draft_page:read` を含みます)。下書きを公開するには `page:write` も要ります
            draft_page:delete: 自分の下書きを編集履歴ごと削除する (`draft_page:read` を含みます)
            attachment:read: スペースの添付ファイルを取得する。非公開トピックのページが参照する添付ファイルも含みます
    personalAccessToken:
      type: http
      scheme: bearer
      description: |
        スペース設定で発行した個人用アクセストークンです。
        発行したスペースに属し、発行時に選んだスコープの範囲で使えます。
  parameters:
    SpaceIdentifier:
      name: space_identifier
      in: path
      required: true
      description: スペースの識別子です。WebのURL (`/s/{space_identifier}`) と同じ値です。
      schema:
        type: string
    TopicNumber:
      name: topic_number
      in: path
      required: true
      description: スペース内のトピックの番号です。WebのURL (`/s/{space_identifier}/topics/{topic_number}`) と同じ値です。
      schema:
        type: integer
        format: int32
        minimum: 1
    PageNumber:
      name: page_number
      in: path
      required: true
      description: スペース内のページの番号です。WebのURL (`/s/{space_identifier}/pages/{page_number}`) と同じ値です。
      schema:
        type: integer
        format: int32
        minimum: 1
    DraftPageRevisionID:
      name: draft_page_revision_id
      in: path
      required: true
      description: 下書きのリビジョンのIDです。`listDraftPageRevisions` の応答の `id` と同じ値です。
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    AttachmentID:
      name: attachment_id
      in: path
      required: true
      description: 添付ファイルのIDです。ページの本文で添付ファイルを参照するパス (`/attachments/{ID}`) のIDと同じ値です。
      schema:
        type: string
        format: uuid
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        続きのページを取得するためのカーソルです。前のページの応答の `next_cursor` をそのまま渡します。
        中身の形式は公開しておらず、予告なく変わることがあります。省略すると最初のページを返します。
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 1ページの件数です。100を超える値は100として扱います。
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 20
  headers:
    Link:
      description: |
        次のページのURLです (RFC 8288。例: `</api/v1/spaces/seed-wiki/topics?cursor=...>; rel="next"`)。
        続きが無い場合は付きません。
      schema:
        type: string
    ETag:
      description: |
        リソースの応答の内容から計算したエンティティタグです (例: `"3q2-7wEBYm8aHqhqcl7IJ4K_xGJmBGyBMs5-yHaI0Wk"`)。
        応答が変われば値も変わります。ただし、スキーマの説明で `ETag` の計算に含めないとした項目 (`url`・`topic_name` など) だけが変わった場合は変わりません。
      required: true
      schema:
        type: string
    RateLimitPolicy:
      description: |
        レート制限のポリシーです (例: `"space_member";q=5000;w=3600`)。
        レート制限のカウンターを確かめられなかった場合は付きません。
      schema:
        type: string
    RateLimit:
      description: |
        レート制限の残量です (例: `"space_member";r=4999;t=1800`)。
        レート制限のカウンターを確かめられなかった場合は付きません。
      schema:
        type: string
    RetryAfter:
      description: 再試行できるまでの秒数です。
      required: true
      schema:
        type: integer
    WWWAuthenticate:
      description: |
        RFC 6750のBearer認証のチャレンジです。
        トークンを送らなかった場合は `Bearer`、送ったトークンを受け付けられない場合は `Bearer error="invalid_token"` です。
        トークンのスコープが足りない場合 (403) は `Bearer error="insufficient_scope", scope="topic:read"` のように要るスコープを示します。
        トークンを使うoperationはすべてスペース配下 (`/spaces/{space_identifier}` とその下) にあり、401・403のどちらにも、そのスペースの保護リソースのメタデータ (RFC 9728) のURLを `resource_metadata="https://example.com/.well-known/oauth-protected-resource/api/v1/spaces/{space_identifier}"` のように付けます。
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: リクエスト本文がJSONとして読めません。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedMediaType:
      description: |
        リクエスト本文のメディアタイプを受け付けません。
        受け付けるメディアタイプを `Accept-Post` ヘッダーで示します。
      headers:
        Accept-Post:
          description: "受け付けるリクエスト本文のメディアタイプです (例: `application/json`)。"
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnsupportedPatchMediaType:
      description: |
        リクエスト本文のメディアタイプを受け付けません。
        受け付けるメディアタイプを `Accept-Patch` ヘッダーで示します。
      headers:
        Accept-Patch:
          description: "受け付けるリクエスト本文のメディアタイプです (例: `application/merge-patch+json`)。"
          required: true
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AlreadyExists:
      description: |
        作成しようとしたリソースがすでにあります。
        `type` は `/api/problems/already-exists` で終わるURIで、`detail` で既にあるリソースを読む方法を示します。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionFailed:
      description: |
        `If-Match` の `ETag` がリソースの今の `ETag` と一致しません。
        リクエストを送る前に、別の更新が行われています。
        `detail` で、取得し直してから更新し直すなどの対処を示します。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PreconditionRequired:
      description: 更新の前提にする `ETag` を `If-Match` ヘッダーで送る必要があります。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Unauthorized:
      description: |
        トークンが無い、無効・期限切れ・失効済み、またはトークンの持ち主がトークンを使い続ける権限を失っています。
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    Forbidden:
      description: |
        トークンにこの操作に要るスコープがありません。
        `WWW-Authenticate` ヘッダーの `scope` で要るスコープを示します。
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    NotFound:
      description: |
        リソースが存在しないか、見る権限がありません。
        トークンが属さないスペースを指定した場合も404です。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ValidationFailed:
      description: |
        パラメーターやリクエスト本文の内容が正しくありません。
        `errors` でフィールド単位の問題を示します。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    TooManyRequests:
      description: レート制限を超えました。
      headers:
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnexpectedError:
      description: 予期しないエラー
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    Space:
      type: object
      description: スペースです。
      required:
        - id
        - identifier
        - name
      properties:
        id:
          type: string
          format: uuid
          description: スペースのIDです。
        identifier:
          type: string
          description: スペースの識別子です。パスの `space_identifier` に使います。
        name:
          type: string
          description: スペースの名前です。
    SpaceMember:
      type: object
      description: スペースメンバーです。
      required:
        - id
        - atname
        - name
      properties:
        id:
          type: string
          format: uuid
          description: スペースメンバーのIDです。同じ人でもスペースごとに異なります。
        atname:
          type: string
          description: アットネーム (`@` の後に続く名前) です。
        name:
          type: string
          description: 表示名です。設定していない場合は空文字列です。
    Token:
      type: object
      description: リクエストに使ったトークンの情報です。
      required:
        - kind
        - scopes
        - expires_at
      properties:
        kind:
          type: string
          enum:
            - personal_access_token
            - oauth_access_token
          description: |
            トークンの種類です。`personal_access_token` はスペース設定で発行した個人用アクセストークン、`oauth_access_token` はOAuth 2.0で取得したアクセストークンです。
        scopes:
          type: array
          description: |
            トークンのスコープに含意を展開したものです。
            トークンに付与できるスコープ (`securitySchemes` の `oauth2` に並べたもの) の順に並びます。
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          description: |
            トークンの有効期限です (RFC 3339のUTC。例: `2026-09-01T12:34:56.123456Z`)。
            秒未満はマイクロ秒まで含み、末尾の0は省きます。
            個人用アクセストークンは期限を過ぎると使えなくなるため、スペース設定で発行し直してください。
            OAuthのアクセストークンは、期限が切れる前でもリフレッシュトークンで更新できます。
    Topic:
      type: object
      description: トピックです。
      required:
        - id
        - number
        - name
        - description
        - visibility
      properties:
        id:
          type: string
          format: uuid
          description: トピックのIDです。
        number:
          type: integer
          format: int32
          description: スペース内のトピックの番号です。パスの `topic_number` に使います。
        name:
          type: string
          description: トピックの名前です。
        description:
          type: string
          description: トピックの説明です。設定していない場合は空文字列です。
        visibility:
          type: string
          enum:
            - public
            - private
          description: |
            トピックの公開範囲です。`public` は誰でも見られる公開トピック、`private` はトピックメンバーなどだけが見られる非公開トピックです。
    TopicList:
      type: object
      description: トピックの一覧の1ページです。
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: このページのトピックです。
          items:
            $ref: "#/components/schemas/Topic"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    Page:
      type: object
      description: ページです。
      required:
        - id
        - number
        - topic_number
        - topic_name
        - title
        - body
        - status
        - modified_at
        - url
      properties:
        id:
          type: string
          format: uuid
          description: ページのIDです。
        number:
          type: integer
          format: int32
          description: スペース内のページの番号です。パスの `page_number` に使います。
        topic_number:
          type: integer
          format: int32
          description: ページが属するトピックの番号です。
        topic_name:
          type: string
          description: |
            ページが属するトピックの名前です。別のトピックのページへのWikiリンク (`[[トピック名/タイトル]]`) に使います。
            ページの `ETag` の計算には含めません。トピック名を変えても `ETag` は変わらないため、`If-None-Match` で304を受け取ったときに手元に残している値は、変える前の名前のことがあります。
        title:
          type: [string, "null"]
          description: ページのタイトルです。タイトルの無いページでは `null` です。
        body:
          type: string
          description: ページの本文 (Markdown) です。
        status:
          type: string
          enum:
            - published
            - unpublished
          description: |
            ページの公開状態です。`published` は公開済みのページ、`unpublished` はWikiリンクで自動作成されたページなど、まだ公開していないページです。
            `updatePage` で未公開のページを更新すると `published` になります。
        modified_at:
          type: string
          format: date-time
          description: |
            ページの内容を最後に更新した日時です (RFC 3339のUTC。例: `2026-09-01T12:34:56.123456Z`)。
            秒未満はマイクロ秒まで含み、末尾の0は省きます。`modified_since` にそのまま渡せます。
        url:
          type: string
          format: uri
          description: |
            Web画面でページを開くURLです (例: `https://example.com/s/my-space/pages/12`)。
            利用者に出典としてページを示すときに使います。
            URLはサーバーが決めるため、`number` などから組み立てずにこの値を使ってください。
            ページの `ETag` の計算には含めません。
    NewPage:
      type: object
      description: 作成するページです。
      required:
        - topic_number
        - title
        - body
      properties:
        topic_number:
          type: integer
          format: int32
          minimum: 1
          description: ページを作成するトピックの番号です。
        title:
          $ref: "#/components/schemas/PageTitleInput"
        body:
          $ref: "#/components/schemas/PageBodyInput"
    PagePatch:
      type: object
      description: |
        ページの更新内容です (JSON Merge Patch)。含めた項目だけを更新します。
        どの項目も `null` にはできません。定義していない項目を含めると422を返します。
      additionalProperties: false
      properties:
        title:
          $ref: "#/components/schemas/PageTitleInput"
        body:
          $ref: "#/components/schemas/PageBodyInput"
    PageTitleInput:
      type: string
      minLength: 1
      maxLength: 200
      description: |
        ページのタイトルです。トピック内で重複できません。
        `/`・`\`・`:`・制御文字は使えず、先頭と末尾にスペースを置けません。
    PageBodyInput:
      type: string
      description: ページの本文 (Markdown) です。空文字列にもできます。
    PageList:
      type: object
      description: ページの一覧の1ページです。
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: このページのページです。
          items:
            $ref: "#/components/schemas/Page"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    NewBodyEdit:
      type: object
      description: 本文に順に適用する編集です。
      required:
        - edits
      additionalProperties: false
      properties:
        edits:
          type: array
          minItems: 1
          maxItems: 100
          description: 配列の順に、前の編集を適用した後の本文へ適用する編集です。
          items:
            $ref: "#/components/schemas/BodyEdit"
    BodyEdit:
      type: object
      description: 本文の検索置換の1件の編集です。
      required:
        - old_str
        - new_str
      additionalProperties: false
      properties:
        old_str:
          type: string
          minLength: 1
          description: 置き換える文字列です。大文字小文字・空白・改行も含めて、本文と完全に一致する必要があります。改行コードのCRLFはLFとして照合します。
        new_str:
          type: string
          description: 置き換えた後の文字列です。空文字列にすると、一致した箇所を削除します。
        replace_all:
          type: boolean
          default: false
          description: |
            `true` なら、`old_str` に一致する箇所をすべて置き換えます。
            `false` なら、一致がちょうど1件の場合だけ置き換え、0件か複数件なら422を返します。
    NewWikilinkPreview:
      type: object
      description: リンク先を確かめる本文です。
      required:
        - topic_number
        - body
      properties:
        topic_number:
          type: integer
          format: int32
          minimum: 1
          description: |
            本文を書き込むページのトピックの番号です。
            トピックを書かないWikiリンク (`[[タイトル]]`) は、このトピックのページを指します。
        body:
          $ref: "#/components/schemas/PageBodyInput"
    WikilinkPreview:
      type: object
      description: 本文のWikiリンクのリンク先です。
      required:
        - links
      properties:
        links:
          type: array
          description: |
            本文のWikiリンクを、本文に現れる順に並べたものです。
            同じトピックとタイトルを指すWikiリンクが複数ある場合は、最初の1つだけを含みます。
          items:
            $ref: "#/components/schemas/WikilinkPreviewLink"
    WikilinkPreviewLink:
      type: object
      description: 本文の1つのWikiリンクのリンク先です。
      required:
        - text
        - topic_name
        - page_title
        - resolution
        - page
      properties:
        text:
          type: string
          description: "Wikiリンクの `[[` と `]]` の間に書かれた文字列です (前後の空白を除く。例: `トピック/タイトル`)。"
        topic_name:
          type: string
          description: リンク先のトピックの名前です。トピックを書かないWikiリンクでは、`topic_number` のトピックの名前です。
        page_title:
          type: string
          description: リンク先のページのタイトルです。Wikiリンクに書かれたとおりの表記です。
        resolution:
          type: string
          enum:
            - existing_page
            - new_page
            - topic_not_found
          description: |
            リンク先の解決の結果です。
            `existing_page` はリンク先のページが既にあること、`new_page` は書き込むとリンク先のページが未公開の状態で作られること、`topic_not_found` はリンク先のトピックが無いか見られずリンクにならないことを表します。
        page:
          description: |
            リンク先の既存のページです。`resolution` が `existing_page` のときに返します。
            `existing_page` でも、ゴミ箱に入っているなどで `getPage` で開けないページでは `null` です。
            `new_page` と `topic_not_found` では `null` です。
          oneOf:
            - $ref: "#/components/schemas/WikilinkPreviewPage"
            - type: "null"
    WikilinkPreviewPage:
      type: object
      description: Wikiリンクが指す既存のページです。
      required:
        - id
        - number
        - topic_number
        - title
        - status
        - url
      properties:
        id:
          type: string
          format: uuid
          description: ページのIDです。
        number:
          type: integer
          format: int32
          description: スペース内のページの番号です。パスの `page_number` に使います。
        topic_number:
          type: integer
          format: int32
          description: ページが属するトピックの番号です。
        title:
          type: [string, "null"]
          description: ページのタイトルです。タイトルの無いページでは `null` です。
        status:
          type: string
          enum:
            - published
            - unpublished
          description: |
            ページの公開状態です。`published` は公開済みのページ、`unpublished` はWikiリンクで自動作成されたページなど、まだ公開していないページです。
        url:
          type: string
          format: uri
          description: |
            Web画面でページを開くURLです (例: `https://example.com/s/my-space/pages/12`)。
            URLはサーバーが決めるため、`number` などから組み立てずにこの値を使ってください。
    DraftPage:
      type: object
      description: |
        トークンの持ち主のページの下書きです。
        下書きはページとメンバーの組に1つで、ページ番号で指します。
      required:
        - page_number
        - topic_number
        - topic_name
        - title
        - body
        - modified_at
        - url
      properties:
        page_number:
          type: integer
          format: int32
          description: 下書きのページの番号です。パスの `page_number` に使います。
        topic_number:
          type: integer
          format: int32
          description: 下書きのページが属するトピックの番号です。
        topic_name:
          type: string
          description: |
            下書きのページが属するトピックの名前です。別のトピックのページへのWikiリンク (`[[トピック名/タイトル]]`) に使います。
            下書きの `ETag` の計算には含めません。トピック名を変えても `ETag` は変わらないため、`If-None-Match` で304を受け取ったときに手元に残している値は、変える前の名前のことがあります。
        title:
          type: [string, "null"]
          description: 下書きのタイトルです。タイトルの無い下書きでは `null` です。
        body:
          type: string
          description: 下書きの本文 (Markdown) です。
        modified_at:
          type: string
          format: date-time
          description: |
            下書きの内容を最後に更新した日時です (RFC 3339のUTC。例: `2026-09-01T12:34:56.123456Z`)。
            Web画面の自動保存でも更新されます。
            秒未満はマイクロ秒まで含み、末尾の0は省きます。
        url:
          type: string
          format: uri
          description: |
            Web画面で下書きのページの編集画面を開くURLです (例: `https://example.com/s/my-space/pages/12/edit`)。
            利用者に下書きを確かめてもらうときに使います。
            URLはサーバーが決めるため、`page_number` などから組み立てずにこの値を使ってください。
            下書きの `ETag` の計算には含めません。
    DraftPagePatch:
      type: object
      description: |
        下書きの更新内容です (JSON Merge Patch)。含めた項目だけを更新します。
        `title` だけは `null` にでき、下書きのタイトルを外します。定義していない項目を含めると422を返します。
      additionalProperties: false
      properties:
        title:
          type: [string, "null"]
          minLength: 1
          description: |
            下書きのタイトルです。`null` にするとタイトルを外します。
            ページのタイトルの規則 (トピック内で重複できないなど) は、下書きを公開するときに確かめます。
          x-go-type: nullable.Nullable[string]
          x-go-type-import:
            path: github.com/oapi-codegen/nullable
          x-go-type-skip-optional-pointer: true
        body:
          type: string
          description: 下書きの新しい本文 (Markdown) です。変えない部分も含めた本文の全体を送ります。空文字列にもできます。
    NewDraftPage:
      type: object
      description: |
        作成する下書きです。
        `page_number` と `topic_number` のどちらか一方を指定します。
      properties:
        page_number:
          type: integer
          format: int32
          minimum: 1
          description: 下書きを作成する既存のページの番号です。
        topic_number:
          type: integer
          format: int32
          minimum: 1
          description: 新しいページを作成するトピックの番号です。
        title:
          type: string
          minLength: 1
          description: |
            下書きのタイトルです。
            ページのタイトルの規則 (トピック内で重複できないなど) は、下書きを公開するときに確かめます。
        body:
          type: string
          description: 下書きの本文 (Markdown) です。空文字列にもできます。
    DraftPageList:
      type: object
      description: 下書きの一覧の1ページです。
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: このページの下書きです。
          items:
            $ref: "#/components/schemas/DraftPage"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    DraftPageRevision:
      type: object
      description: |
        トークンの持ち主の下書きのリビジョンです。
        下書きのある時点のタイトルと本文の記録で、作成した後は変わりません。
      required:
        - id
        - title
        - body
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: リビジョンのIDです。パスの `draft_page_revision_id` に使います。
        title:
          type: [string, "null"]
          description: リビジョンを作ったときの下書きのタイトルです。タイトルの無い下書きでは `null` です。
        body:
          type: string
          description: リビジョンを作ったときの下書きの本文 (Markdown) です。
        created_at:
          type: string
          format: date-time
          description: |
            リビジョンを作った日時です (RFC 3339のUTC。例: `2026-09-01T12:34:56.123456Z`)。
            秒未満はマイクロ秒まで含み、末尾の0は省きます。
    DraftPageRevisionList:
      type: object
      description: 下書きの編集履歴の1ページです。
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          description: このページのリビジョンです。
          items:
            $ref: "#/components/schemas/DraftPageRevision"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    Attachment:
      type: object
      description: |
        スペースの添付ファイルの情報と、中身をダウンロードする署名付きURLです。
      required:
        - id
        - filename
        - content_type
        - byte_size
        - download_url
        - download_url_expires_at
      properties:
        id:
          type: string
          format: uuid
          description: 添付ファイルのIDです。ページの本文の `/attachments/{ID}` のIDと同じ値です。
        filename:
          type: string
          description: アップロードしたときのファイル名です。
        content_type:
          type: [string, "null"]
          description: |
            ファイルの種類 (メディアタイプ。例: `image/png`) です。
            種類が記録されていないファイルでは `null` です。
        byte_size:
          type: integer
          format: int64
          description: ファイルのバイト数です。
        download_url:
          type: string
          format: uri
          description: |
            中身をダウンロードする署名付きURLです。
            `Authorization` ヘッダーのトークンを付けずに `GET` を送ってください。
            URL自体が取得の権限を持つため、ログなどに残さないでください。
        download_url_expires_at:
          type: string
          format: date-time
          description: |
            `download_url` の有効期限です (RFC 3339のUTC。例: `2026-09-01T12:34:56Z`)。
            署名付きURLが実際に使えなくなる時刻より遅くならないよう、秒未満は含みません。
            過ぎたら `getAttachment` を呼び直して新しいURLを受け取ってください。
    NextCursor:
      type: [string, "null"]
      description: 次のページを取得するカーソルです。`cursor` パラメーターに渡します。続きが無い場合は `null` です。
    ProblemDetails:
      type: object
      description: RFC 9457のProblem Detailsです。
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          description: |
            問題の種類を表すURIです。種類ごとに変わらない値で、プログラムでの判別に使えます。
            ステータスコード以上の情報を持たない問題では `about:blank` です。
        title:
          type: string
          description: 問題の種類の短い説明です。
        status:
          type: integer
          description: HTTPステータスコードです。
        detail:
          type: [string, "null"]
          description: この発生に固有の説明です。
        errors:
          type: array
          description: フィールド単位の問題です。`type` が `validation-failed` の問題にだけ含みます。
          items:
            $ref: "#/components/schemas/ProblemDetailsError"
    ProblemDetailsError:
      type: object
      description: リクエストの検証で見つかった1つの問題です。
      required:
        - detail
        - pointer
        - parameter
      properties:
        detail:
          type: string
          description: 問題の説明です。
        pointer:
          type: [string, "null"]
          description: リクエスト本文の問題の箇所を指すJSON Pointer (URIフラグメント形式。例 `#/title`) です。本文以外の問題では `null` です。
        parameter:
          type: [string, "null"]
          description: 問題のあったパラメーター (パス・クエリ・ヘッダー) の名前です。パラメーター以外の問題では `null` です。
