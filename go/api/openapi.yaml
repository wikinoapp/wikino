  /spaces/{space_identifier}/pages/{page_number}/body_edits:
    post:
      operationId: createPageBodyEdit
      summary: ページの本文を検索置換する
      description: |
        ページ番号で指定したページの本文に、`edits` の編集を配列の順に適用し、更新したページを返します。
        各編集は、前の編集を適用した後の本文で `old_str` に一致する箇所を `new_str` に置き換えます。
        `old_str` は大文字小文字・空白も含めて完全に一致する必要があり、`replace_all` が `false` (既定) の編集は一致がちょうど1件でなければなりません。
        1件でも適用できない編集があれば、どの編集も適用せずに422を返します。
        各編集を適用した後の本文は、UTF-8で1,048,576バイト (1MiB) 以下である必要があります。途中の編集で上限を超える場合も、どの編集も適用せずに422を返します。
        本文の改行コード (CRLF) は、`old_str`・`new_str` と同じLFとして照合し、更新した本文の改行コードはLFになります。
        置換した後の本文は `updatePage` と同じく保存し、まだ公開していないページ (`status` が `unpublished`) は公開します。
        本文のWikiリンクが存在しないページを指す場合は、リンク先のページを未公開の状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。
        トークンの持ち主がWeb画面で編集中の下書きは、更新しても削除しません。
        公開済みのページで置換しても本文が変わらない場合は何も更新せず、今のページを返します。
        応答の `Content-Location` ヘッダーは更新したページのURL、`ETag` ヘッダーは `getPage` と同じ値です。

        長いページの一部だけを書き換えるときに使います。本文の全体を送り直す `updatePage` と違い、変えない部分を送らずに済みます。
        タイトルを変えるには `updatePage` を使います。
        `old_str` を決めるには、本文を読む必要があります。`getPage` で今の本文を読み、置き換えたい箇所を、本文の中で1か所に決まる長さで `old_str` に指定してください。

        `If-Match` ヘッダーは任意です。
        `old_str` が今の本文に一致すること自体が、読んだ本文を前提にしていることの確かめになるため、省略しても他の人の変更を気付かずに上書きしません。
        省略すると、`getPage` で読んだ後に関係のない箇所が更新されていても置換できます。
        読んだ版のままの本文にだけ適用したい場合は、`getPage` の `ETag` を `If-Match` ヘッダーで送ってください。

        非公開トピックのページを更新するには、トークンが `page:write` に加えて `topic:read` を持つ必要があります。

        失敗したときは、次のように対処してください。

        - 422 (`edits/{位置}/old_str`): その位置 (0始まり) の編集の `old_str` が、前の編集を適用した後の本文に一致しないか、`replace_all` が `false` なのに複数の箇所に一致します。`errors` の `detail` で一致の件数を確かめ、`getPage` で今の本文を読んで `old_str` を直してください。どの編集も適用していないため、直した後は `edits` の全体を送り直してください
        - 422 (`edits/{位置}/new_str`): その編集後の本文が1,048,576バイトを超えます。どの編集も適用していません。各編集の途中結果も上限以下に収まるように、編集する内容を減らしてください
        - 422 (`title`): タイトルの無い未公開のページです。`updatePage` で `title` を含めて更新してください
        - 412: `If-Match` を送った場合に、読んだ後にページが更新されています。`getPage` で取得し直し、今の本文で `old_str` を確かめてから送り直してください
        - 403: トークンが `page:write` を持たないか、トークンの持ち主にページの更新権限がありません
        - 404: ページが存在しないか、ゴミ箱に入っているか、トークンの持ち主またはトークンが所属トピックを閲覧できません
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: false
        confirmation_required: false
      tags:
        - page_body_edit
      security:
        - oauth2:
            - page:write
        - personalAccessToken:
            - page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-Match
          in: header
          required: false
          description: |
            置換の前提にするページの `ETag` です。送った場合は、ページの今の `ETag` と一致する場合だけ置換します。
            途中のプロキシが応答の `ETag` に `W/` を付けることがあります。`W/` の付いた値のまま送っても、付いていない値と同じに照合します。
            省略すると版を照合せず、今の本文に置換を適用します。
          schema:
            type: string
      requestBody:
        description: 本文に順に適用する編集です。
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBodyEdit"
      responses:
        "200":
          description: 更新したページ
          headers:
            Content-Location:
              description: "更新したページのURLです (例: `/api/v1/spaces/seed-wiki/pages/42`)。"
              required: true
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/wikilink_previews:
    post:
      operationId: createWikilinkPreview
      summary: 本文のWikiリンクのリンク先を確かめる
      description: |
        トピック番号と本文を受け取り、その本文をトピックのページや下書きに書き込んだときに、本文のWikiリンクがそれぞれどのページを指すかを返します。
        ページや下書きは作成も更新もしません。
        本文がURLに収まらないためPOSTで送りますが、何度送っても同じ結果になります。

        ページの作成・更新・公開と下書きの作成・更新は、本文のWikiリンクが存在しないページを指すと、リンク先のページを未公開の状態で作成します。
        書き込む前にこのoperationで、意図しないリンク先のページが作られないかを確かめてください。
        Wikiリンクの解釈は書き込みと同じで、コードとして書いた `[[...]]` やエスケープした `[[...]]` はWikiリンクになりません。

        各Wikiリンクの `resolution` は次のいずれかです。

        - `existing_page`: リンク先のページが既にあります。書き込んでもページは作られません
        - `new_page`: リンク先のページがありません。書き込むと、リンク先のトピックに未公開のページとして作られます
        - `topic_not_found`: リンク先のトピックが無いか、トークンで見られません。リンクにならず、書き込んでもページは作られません

        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) へのリンクは、ページの有無にかかわらず `topic_not_found` になります。
        書き込みでも、見られないトピックにはリンク先のページを作成しません。
        トピックの名前を確かめるには `listTopics` を使います。

        失敗したときは、次のように対処してください。

        - 422 (`topic_number`): トピックが存在しないか見られません。`listTopics` でトピックの番号を確かめてください
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - wikilink_preview
      security:
        - oauth2:
            - page:read
        - personalAccessToken:
            - page:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
      requestBody:
        description: 書き込む先のトピック番号と、書き込む本文です。
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWikilinkPreview"
      responses:
        "200":
          description: 本文のWikiリンクのリンク先
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikilinkPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
