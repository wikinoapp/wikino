    patch:
      operationId: updatePage
      summary: ページを更新する
      description: |
        ページ番号で指定したページのタイトルと本文を、JSON Merge Patch (RFC 7396) で更新し、更新したページを返します。
        リクエスト本文に含めた項目だけを更新し、含めなかった項目は変えません。
        本文を含める場合は、変えない部分も含めた本文の全体を送ります。
        まだ公開していないページ (`status` が `unpublished`) を更新すると、Web画面での編集と同じくそのページを公開します。
        本文のWikiリンクが存在しないページを指す場合は、Web画面での公開と同じく、リンク先のページを下書きの状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。
        トークンの持ち主がWeb画面で編集中の下書きは、更新しても削除しません。
        公開済みのページでタイトルと本文が今と同じ場合は何も更新せず、今のページを返します。

        既にあるページのタイトルや本文を変えるときに使います。
        新しいページを作るには `createPage` を使います。
        更新の前に `getPage` でページを取得し、応答の `ETag` を `If-Match` ヘッダーで送ってください。
        取得した具体的な `ETag` を指定し、1回目の更新で `ETag` が変わった場合、同じ要求を送り直すと412になります。
        内容に変更が無い場合は `ETag` が変わらず、同じ要求を送り直しても200を返します。
        `If-Match: *` はページが存在すれば版を問わず一致するため、古い版での上書きを防ぐには、取得した具体的な `ETag` を指定してください。

        非公開トピックのページを更新するには、トークンが `page:write` に加えて `topic:read` を持つ必要があります。

        失敗したときは、次のように対処してください。

        - 428: `If-Match` ヘッダーがありません。`getPage` で `ETag` を受け取って送り直してください
        - 412: 取得した後にページが更新されています。`getPage` で取得し直し、今の内容に変更を反映してから、新しい `ETag` で更新し直してください
        - 422 (`title`): タイトルに使えない文字があるか、同じタイトルのページがトピックにあるか、タイトルの無い未公開のページを `title` を含めずに公開しようとしています。`errors` の `detail` を確かめてください
        - 404: ページが存在しないか、ゴミ箱に入っているか、トークンの持ち主がページを更新できません
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - page
      security:
        - oauth2:
            - page:write
        - personalAccessToken:
            - page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-Match
          in: header
          required: false
          description: |
            更新の前提にするページの `ETag` です。ページの今の `ETag` と一致する場合だけ更新します。
            途中のプロキシが応答の `ETag` に `W/` を付けることがあります。`W/` の付いた値のまま送っても、付いていない値と同じに照合します。
            省略すると428を返します。
          schema:
            type: string
      requestBody:
        description: 更新する項目です。JSON Merge Patch (`application/merge-patch+json`) で送ります。
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/PagePatch"
      responses:
        "200":
          description: 更新したページ
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedPatchMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
