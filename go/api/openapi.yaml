    post:
      operationId: createDraftPage
      summary: 下書きを作成する
      description: |
        トークンの持ち主の下書きを作成し、作成した下書きを返します。
        本文には、既存のページの番号 `page_number` か、新しいページを作るトピックの番号 `topic_number` のどちらか一方を指定します。
        既存のページでは、`title` と `body` を省くと、ページの今のタイトルと本文を使います。
        新しいページでは、Web画面での作成と同じく、タイトルと本文の無い未公開のページを作り、その下書きを作ります。
        新しいページで `title` を省くとタイトルの無い下書きに、`body` を省くと本文の空の下書きになります。
        作成と同時に、下書きの編集履歴を1件作ります。
        本文のWikiリンクが存在しないページを指す場合は、Web画面での下書きの保存と同じく、リンク先のページを未公開の状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。
        応答の `Location` ヘッダーは作成した下書きのURL、`ETag` ヘッダーは `getDraftPage` と同じ値です。

        ページを公開せずに書き換えるときに、最初に使います。
        下書きがすでにあるページでは、`getDraftPage` で今の下書きを読みます。

        新しいページの下書きを作成するには、トークンが `draft_page:write` に加えて `page:write` を持つ必要があります。
        非公開トピックのページの下書きを作成するには、トークンが `topic:read` も持つ必要があります。

        失敗したときは、次のように対処してください。

        - 409: ページにトークンの持ち主の下書きがすでにあります。`type` は `/api/problems/already-exists` で終わるURIです。`getDraftPage` で今の下書きを読んでください
        - 422 (`page_number`): ページが存在しないか、ゴミ箱に入っているか、見られません。`listPages` でページの番号を確かめてください
        - 422 (`topic_number`): トピックが存在しないか見られません。`listTopics` でトピックの番号を確かめてください
        - 422 (`pointer` が `null`): `page_number` と `topic_number` のどちらも指定していません。どちらか一方を指定してください
        - 422 (`page_number` と `topic_number` の両方): どちらか一方だけを指定してください
        - 404: ページやトピックは見られますが、トークンの持ち主はそこに下書きを作成できません。新しいページでは、トークンに `page:write` があるかも確かめてください
        - 応答を受け取れず結果が分からない場合: 既存のページでは、送り直して409になれば作成済みです。新しいページではこのoperationは冪等ではないため、送り直す前に `listDraftPages` で作成済みかを確かめてください
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: false
        confirmation_required: false
      tags:
        - draft_page
      security:
        - oauth2:
            - draft_page:write
        - personalAccessToken:
            - draft_page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
      requestBody:
        description: 下書きを作成するページ (既存のページの番号か、新しいページのトピックの番号) と、下書きのタイトル・本文です。
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDraftPage"
      responses:
        "201":
          description: 作成した下書き
          headers:
            Location:
              description: "作成した下書きのURLです (例: `/api/v1/spaces/seed-wiki/pages/42/draft_page`)。"
              required: true
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AlreadyExists"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages/{page_number}/draft_page:
    get:
      operationId: getDraftPage
      summary: 下書きを取得する
      description: |
        ページ番号で指定したページについて、トークンの持ち主の下書きを本文を含めて返します。
        下書きはページとメンバーの組に1つで、ほかのメンバーの下書きは返しません。

        書きかけの内容を読むときと、下書きを更新する前に今の `ETag` を受け取るときに使います。
        番号が分からなければ、`listDraftPages` で探します。

        非公開トピックのページの下書きを読むには、トークンが `draft_page:read` に加えて `topic:read` を持つ必要があります。

        応答の `ETag` ヘッダーは下書きのタイトル・本文・所属するトピック (トピック名は含めません)・更新日時から計算します。
        前回の応答の `ETag` を `If-None-Match` ヘッダーで送ると、応答が変わっていない場合は本文の無い304を返します。
        304を受け取ったら、手元に残している前回の応答をそのまま使ってください。

        ページが存在しない場合、ページにトークンの持ち主の下書きが無い場合、ページがゴミ箱に入っている場合、見られない非公開トピックのページの場合は404を返します。
        404を受け取ったら、`listDraftPages` で下書きのあるページの番号を確かめてください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - draft_page
      security:
        - oauth2:
            - draft_page:read
        - personalAccessToken:
            - draft_page:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-None-Match
          in: header
          required: false
          description: 前回の応答の `ETag` です。下書きの応答が変わっていなければ304を返します。
          schema:
            type: string
      responses:
        "200":
          description: 下書き
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPage"
        "304":
          description: "`If-None-Match` の `ETag` と下書きの応答が一致したため、本文を返しません。"
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    patch:
      operationId: updateDraftPage
      summary: 下書きを更新する
      description: |
        ページ番号で指定したページについて、トークンの持ち主の下書きのタイトルと本文を、JSON Merge Patch (RFC 7396) で更新し、更新した下書きを返します。
        リクエスト本文に含めた項目だけを更新し、含めなかった項目は変えません。
        本文を含める場合は、変えない部分も含めた本文の全体を送ります。
        `title` を `null` にすると、下書きのタイトルを外します。
        ページは公開せず、公開済みのページの内容も変えません。
        更新と同時に、Web画面での手動保存と同じく下書きの編集履歴を1件作ります。直前の編集履歴と同じ内容なら作りません。
        本文のWikiリンクが存在しないページを指す場合は、Web画面での下書きの保存と同じく、リンク先のページを未公開の状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。
        タイトルと本文が今の下書きと同じ場合は下書きを書き換えず、`ETag` も変わりません。

        `createDraftPage` で作った下書きや、Web画面で書いている下書きを書き換えるときに使います。
        下書きがまだ無いページでは `createDraftPage` を使います。
        更新の前に `getDraftPage` で下書きを取得し、応答の `ETag` を `If-Match` ヘッダーで送ってください。
        Web画面の自動保存でも `ETag` が変わるため、利用者がWeb画面で同じ下書きを編集している場合は412になります。
        `If-Match: *` は下書きが存在すれば版を問わず一致するため、古い版での上書きを防ぐには、取得した具体的な `ETag` を指定してください。
        下書きのタイトルのページのタイトルの規則 (トピック内で重複できないなど) は、下書きを公開するときに確かめます。

        非公開トピックのページの下書きを更新するには、トークンが `draft_page:write` に加えて `topic:read` を持つ必要があります。

        失敗したときは、次のように対処してください。

        - 428: `If-Match` ヘッダーがありません。`getDraftPage` で `ETag` を受け取って送り直してください
        - 412: 取得した後に下書きが更新されています。`getDraftPage` で取得し直し、今の内容に変更を反映してから、新しい `ETag` で更新し直してください
        - 404: ページが存在しないか、ページにトークンの持ち主の下書きが無いか、ページがゴミ箱に入っているか、トークンの持ち主が下書きを更新できません。下書きが無い場合は `createDraftPage` で作成してください
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - draft_page
      security:
        - oauth2:
            - draft_page:write
        - personalAccessToken:
            - draft_page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-Match
          in: header
          required: false
          description: |
            更新の前提にする下書きの `ETag` です。下書きの今の `ETag` と一致する場合だけ更新します。
            途中のプロキシが応答の `ETag` に `W/` を付けることがあります。`W/` の付いた値のまま送っても、付いていない値と同じに照合します。
            省略すると428を返します。
          schema:
            type: string
      requestBody:
        description: 更新する下書きの項目です。JSON Merge Patch (`application/merge-patch+json`) で送ります。
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/DraftPagePatch"
      responses:
        "200":
          description: 更新した下書き
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedPatchMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    delete:
      operationId: deleteDraftPage
      summary: 下書きを削除する
      description: |
        ページ番号で指定したページについて、トークンの持ち主の下書きを編集履歴ごと削除します。
        削除した下書きと編集履歴は元に戻せません。
        ページそのものは削除せず、公開済みのページの内容も変えません。

        書きかけの内容を破棄するときに使います。
        削除の前に `getDraftPage` で下書きを取得して内容を確かめ、応答の `ETag` を `If-Match` ヘッダーで送ってください。
        利用者がWeb画面で同じ下書きを編集している場合は412になり、確かめていない内容を削除しません。

        非公開トピックのページの下書きを削除するには、トークンが `draft_page:delete` に加えて `topic:read` を持つ必要があります。

        失敗したときは、次のように対処してください。

        - 428: `If-Match` ヘッダーがありません。`getDraftPage` で内容と `ETag` を確かめてから送り直してください
        - 412: 取得した後に下書きが更新されています。`getDraftPage` で今の内容を確かめ、削除してよければ新しい `ETag` で削除し直してください
        - 404: ページが存在しないか、ページにトークンの持ち主の下書きが無いか、ページがゴミ箱に入っているか、トークンの持ち主が下書きを削除できません。削除し直して404になった場合は、削除済みです
      x-wikino-operation:
        read_only: false
        irreversible: true
        idempotent: true
        confirmation_required: true
      tags:
        - draft_page
      security:
        - oauth2:
            - draft_page:delete
        - personalAccessToken:
            - draft_page:delete
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/PageNumber"
        - name: If-Match
