openapi: 3.1.1
info:
  title: Wikino API
  version: 1.0.0
  summary: Wikinoのスペースのデータを読み書きする
  description: |
    Wikinoの公開Web APIです。
    APIを呼び出すには、スペース設定で発行する個人用アクセストークンか、OAuth 2.0 (Authorization Code + PKCE) で取得したアクセストークンを `Authorization: Bearer` ヘッダーで送ります。
    どちらのトークンも1つのスペースに属しており、そのスペースに対する操作だけに使えます。

    エラーはRFC 9457のProblem Details (`application/problem+json`) で返します。

    トークンを使うリクエストには、トークンの持ち主のスペースメンバー単位で1時間あたり5000件のレート制限があります。
    同じスペースのトークンは個人用アクセストークンとOAuthのアクセストークンを合わせて数え、同じ人でもスペースが違えば別に数えます。
    残量はIETFで標準化中の `RateLimit-Policy` / `RateLimit` ヘッダーで返します (例: `RateLimit-Policy: "space_member";q=5000;w=3600`、`RateLimit: "space_member";r=4999;t=1800`)。
    `q` は1時間あたりの上限、`w` は時間枠の秒数、`r` は残りの件数、`t` は時間枠が切り替わるまでの秒数です。
    上限を超えると429を返し、再試行できるまでの秒数を `Retry-After` ヘッダーで示します。
  contact:
    name: Wikino
    url: https://github.com/wikinoapp/wikino
servers:
  - url: /api/v1
    description: このドキュメントを配信しているホストのAPI
security:
  - oauth2: []
  - personalAccessToken: []
tags:
  - name: space
    description: トークンが属するスペースの情報
  - name: space_member
    description: スペースメンバー
  - name: token
    description: リクエストに使ったトークン
  - name: topic
    description: スペースのトピック
  - name: page
    description: スペースのページ
  - name: page_body_edit
    description: ページの本文の検索置換
  - name: wikilink_preview
    description: 本文のWikiリンクのリンク先の解決
  - name: draft_page
    description: トークンの持ち主のページの下書き
  - name: draft_page_body_edit
    description: トークンの持ち主のページの下書きの本文の検索置換
  - name: draft_page_revision
    description: トークンの持ち主のページの下書きの編集履歴
  - name: draft_page_publication
    description: トークンの持ち主のページの下書きの公開
  - name: attachment
    description: スペースの添付ファイル
  - name: openapi
    description: このAPIのOpenAPI記述
paths:
  /spaces/{space_identifier}:
    get:
      operationId: getSpace
      summary: トークンが属するスペースを取得する
      description: |
        トークンが属するスペースのID・識別子・名前を返します。

        トークンがどのスペースのものかを確かめるときに使います。
        スコープは要りません。

        トークンが属さないスペースを指定すると404を返します。
        404を受け取ったら、トークンを発行したスペースの識別子 (WebのURLの `/s/{space_identifier}` の部分) を指定し直してください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - space
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
      responses:
        "200":
          description: トークンが属するスペース
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Space"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/members/me:
    get:
      operationId: getCurrentSpaceMember
      summary: トークンの持ち主のスペースメンバーを取得する
      description: |
        トークンが属するスペースでの、トークンの持ち主のスペースメンバー (ID・アットネーム・表示名) を返します。

        誰のトークンかを確かめるときに使います。
        スコープは要りません。

        トークンが属さないスペースを指定すると404を返します。
        404を受け取ったら、トークンを発行したスペースの識別子 (WebのURLの `/s/{space_identifier}` の部分) を指定し直してください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - space_member
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
      responses:
        "200":
          description: トークンの持ち主のスペースメンバー
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMember"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/tokens/current:
    get:
      operationId: getCurrentToken
      summary: リクエストに使ったトークンの情報を取得する
      description: |
        リクエストに使ったトークン自身の種類・スコープ・有効期限を返します。

        操作の前に、トークンに必要なスコープが付いているかや、トークンの期限がいつ切れるかを確かめるときに使います。
        スコープは要りません。

        `scopes` は、トークンに付与したスコープに含意 (例: `page:write` は `page:read` を含む) を展開したものです。
        実際に操作できるかは、トークンのスコープに加えてトークンの持ち主のスペースやトピックでの権限でも決まります。
        `scopes` にあるスコープの操作でも、持ち主に権限が無ければ403や404を返します。

        トークンの値やトークンの名前は返しません。

        トークンが属さないスペースを指定すると404を返します。
        404を受け取ったら、トークンを発行したスペースの識別子 (WebのURLの `/s/{space_identifier}` の部分) を指定し直してください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - token
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
      responses:
        "200":
          description: リクエストに使ったトークンの情報
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/topics:
    get:
      operationId: listTopics
      summary: トピックの一覧を取得する
      description: |
        トークンが属するスペースのトピックを、トピック番号の小さい順に返します。

        ページを作成するトピック (`createPage` の `topic_number`) や、`listPages` で絞り込むトピックの番号を調べるときに使います。

        非公開トピックは、トークンが `topic:read` を持ち、トークンの持ち主がそのトピックを見られる場合にだけ含みます。
        あるはずの非公開トピックが含まれない場合は、トークンに `topic:read` が付いているかを確かめてください。

        一覧はカーソル方式で分割して返します。
        続きがある場合は、本文の `next_cursor` と `Link` ヘッダー (`rel="next"`) で次のページを示します。
        続きが無い場合は `next_cursor` が `null` になり、`Link` ヘッダーは付きません。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - topic
      security:
        - oauth2:
            - topic:read
        - personalAccessToken:
            - topic:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: トピックの一覧
          headers:
            Link:
              $ref: "#/components/headers/Link"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/topics/{topic_number}:
    get:
      operationId: getTopic
      summary: トピックを取得する
      description: |
        トピック番号で指定したトピックの名前・説明・公開範囲を返します。

        番号が分かっているトピックを確かめるときに使います。
        番号が分からなければ `listTopics` で探します。

        非公開トピックは、トークンが `topic:read` を持ち、トークンの持ち主がそのトピックを見られる場合にだけ返します。

        トピックが存在しないか見られない場合は404を返します。
        404を受け取ったら、`listTopics` で見られるトピックの番号を確かめてください。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - topic
      security:
        - oauth2:
            - topic:read
        - personalAccessToken:
            - topic:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - $ref: "#/components/parameters/TopicNumber"
      responses:
        "200":
          description: トピック
          headers:
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topic"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages:
    get:
      operationId: listPages
      summary: ページの一覧を取得する
      description: |
        トークンが属するスペースのページを、本文を含めて更新日時の新しい順に返します。
        既定では公開済みのページだけを返し、`status` を指定するとWikiリンクで自動作成されたページなど、まだ公開していないページも返します。
        ゴミ箱に入れたページは含みません。
        未公開のページは、見られるトピックの公開済みのページか、トークンの持ち主の下書きからWikiリンクで指しているものだけを含みます。
        リンクを消した後に残ったページや、Web画面で作成したまま公開していないページは含みません。

        目的に応じて次のように絞り込みます。

        - トピックのページを読む: `topic_number` を指定します
        - タイトルからページ番号を調べる: `topic_number` と `title` を指定します。タイトルはトピック内で重複しないため、見つかれば1件になります
        - 本文のWikiリンク (`[[タイトル]]`) が指す未公開のページの番号を調べる: `topic_number`・`title`・`status=all` を組み合わせます
        - 前回の取得以降に更新されたページだけを取得する: 前回の取得を始めた日時を `modified_since` に渡します
        - 内容からページを探す: キーワードを `q` に渡します。他の絞り込みと組み合わせられます

        `q` の検索はトークンが属するスペースの中だけを対象にし、タイトルと本文を探します。
        一致度では並べ替えず、他の絞り込みと同じく更新日時の新しい順に返します。
        よく一致するページが先頭に来るとは限らないため、多く見つかる場合はキーワードを足すか、`topic_number` で絞り込んでください。

        番号が分かっている1件のページを読むには `getPage` を使います。

        非公開トピックのページは、トークンが `topic:read` を持ち、トークンの持ち主がそのトピックを見られる場合にだけ含みます。
        あるはずのページが含まれない場合は、トークンに `topic:read` が付いているかと、`status` の指定を確かめてください。

        一覧はカーソル方式で分割して返します。
        続きがある場合は、本文の `next_cursor` と `Link` ヘッダー (`rel="next"`) で次のページを示します。
        続きが無い場合は `next_cursor` が `null` になり、`Link` ヘッダーは付きません。
      x-wikino-operation:
        read_only: true
        irreversible: false
        idempotent: true
        confirmation_required: false
      tags:
        - page
      security:
        - oauth2:
            - page:read
        - personalAccessToken:
            - page:read
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
        - name: topic_number
          in: query
          required: false
          description: |
            このトピック番号のトピックのページだけを返します。
            存在しないトピックや見られないトピックを指定すると、空の一覧を返します。
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: status
          in: query
          required: false
          description: |
            返すページの公開状態です。`published` は公開済みのページだけ、`unpublished` はまだ公開していないページだけ、`all` は両方を返します。
            省略すると `published` として扱います。
          schema:
            type: string
            enum:
              - published
              - unpublished
              - all
            default: published
        - name: title
          in: query
          required: false
          description: |
            このタイトルのページだけを返します。タイトル全体が一致するページだけを返し、大文字と小文字は区別しません。
          schema:
            type: string
            minLength: 1
        - name: q
          in: query
          required: false
          description: |
            このキーワードをタイトルか本文に含むページだけを返します。
            空白 (全角の空白を含む) で区切った複数のキーワードは、すべてを含むページだけを返します (AND検索)。各キーワードはタイトルと本文のどちらに含まれていても構いません。
            部分一致で探し、大文字と小文字は区別しません。`%`・`_` も1つの文字として探します。
            キーワードは10個まで指定できます。空白だけの値と、11個以上のキーワードは422を返します。
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: modified_since
          in: query
          required: false
          description: この日時 (RFC 3339) 以降に更新されたページだけを返します。指定した日時ちょうどに更新されたページも含みます。
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: ページの一覧
          headers:
            Link:
              $ref: "#/components/headers/Link"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
    post:
      operationId: createPage
      summary: ページを作成する
      description: |
        トピック番号で指定したトピックにページを作成してそのまま公開し、作成したページを返します。
        応答の `Location` ヘッダーは作成したページのURL、`ETag` ヘッダーは `getPage` と同じ値です。

        同じタイトルの本文の無い未公開のページ (Wikiリンクで自動作成されたページなど) があれば、新しいページを作らずにそのページに本文を書いて公開します。
        このとき応答の `number` はそのページが作成されたときの番号になり、そのページを指していたWikiリンクも公開したページへのリンクとして保たれます。
        同じタイトルの本文の無い未公開のページがゴミ箱に入っている場合は、そのページを論理削除して新しいページを作ります。
        本文のWikiリンクが存在しないページを指す場合は、Web画面での公開と同じく、リンク先のページを下書きの状態で作成します。
        トークンで見られないトピック (トークンが `topic:read` を持たない場合の非公開トピックなど) には、リンク先のページを作成しません。
        書き込む前にどのリンク先のページが作られるかは、`createWikilinkPreview` で確かめられます。

        新しいページを作るときに使います。
        既にあるページの内容を変えるには `updatePage` を使います。

        非公開トピックにページを作成するには、トークンが `page:write` に加えて `topic:read` を持つ必要があります。

        失敗したときは、次のように対処してください。

        - 422 (`title`): タイトルに使えない文字があるか、同じタイトルのページがトピックにあります。`errors` の `detail` を確かめ、重複の場合は `listPages` に `topic_number` と `title` を指定して既存のページを探し、内容を変えるなら `updatePage` を使ってください
        - 422 (`topic_number`): トピックが存在しないか見られません。`listTopics` でトピックの番号を確かめてください
        - 404: トピックは見られますが、トークンの持ち主はそのトピックにページを作成できません
        - 応答を受け取れず結果が分からない場合: このoperationは冪等ではありません。送り直す前に、`listPages` に `topic_number` と `title` を指定して作成済みかを確かめてください
      x-wikino-operation:
        read_only: false
        irreversible: false
        idempotent: false
        confirmation_required: false
      tags:
        - page
      security:
        - oauth2:
            - page:write
        - personalAccessToken:
            - page:write
      parameters:
        - $ref: "#/components/parameters/SpaceIdentifier"
      requestBody:
        description: 作成するページのトピック番号・タイトル・本文です。
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPage"
      responses:
        "201":
          description: 作成したページ
          headers:
            Location:
              description: "作成したページのURLです (例: `/api/v1/spaces/seed-wiki/pages/42`)。"
              required: true
              schema:
                type: string
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimitPolicy"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /spaces/{space_identifier}/pages/{page_number}:
    get:
      operationId: getPage
      summary: ページを取得する
      description: |
        ページ番号で指定したページを、本文を含めて返します。
        Wikiリンクで自動作成されたページなど、まだ公開していないページも返し、応答の `status` が `unpublished` になります。

        番号が分かっているページを読むときと、`updatePage` の前に今の `ETag` を受け取るときに使います。
        番号が分からなければ、`listPages` の `title` で探します。

        非公開トピックのページを読むには、トークンが `page:read` に加えて `topic:read` を持つ必要があります。

        応答の `ETag` ヘッダーはページのタイトル・本文・所属するトピック (トピック名は含めません)・更新日時・公開状態から計算します。
        前回の応答の `ETag` を `If-None-Match` ヘッダーで送ると、応答が変わっていない場合は本文の無い304を返します。
        304を受け取ったら、手元に残している前回の応答をそのまま使ってください。

        ページが存在しない場合、ゴミ箱に入っている場合、見られない非公開トピックのページの場合は404を返します。
        404を受け取ったら、`listPages` で見られるページの番号を確かめてください。
      x-wikino-operation:
        read_only: true
        irreversible: false
