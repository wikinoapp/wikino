# golangci-lint v2 の設定ファイル
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  # タイムアウト（デフォルト: 1m）
  timeout: 5m
  # テストファイルを含める
  tests: true
  # ビルドタグ
  build-tags: []

linters:
  # 有効化するリンター
  enable:
    - govet # Go標準静的解析
    - staticcheck # 高度な静的解析
    - gosec # セキュリティチェック
    - depguard # 依存関係のルール強制
    - errcheck # エラーチェック漏れ
    - ineffassign # 無駄な代入
    - unused # 未使用コード

  # リンター除外ルール（v2形式）
  exclusions:
    rules:
      # テストファイルでは gosec と depguard を無効化
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - depguard
      # commentlint is a dev-only lint tool that reads scanned files via dynamic paths, so gosec is disabled for it.
      # [Ja] commentlint は開発用のリントツールで、走査対象ファイルを動的なパスで読むため gosec を無効化
      - path: "cmd/commentlint/.*"
        linters:
          - gosec
      # templ 自動生成ファイルは一部のリンターから除外（depguard は有効化）
      - path: '(.+)_templ\.go'
        linters:
          - govet
          - staticcheck
          - gosec
          - errcheck
          - ineffassign
          - unused
    # 除外するディレクトリ
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*

  # リンター固有の設定（v2形式）
  settings:
    # gosec の設定
    gosec:
      # 除外する脆弱性ルール
      # G120: r.FormValue / r.ParseForm のボディサイズ未制限の指摘。
      #   internal/middleware/body_limit.go の BodyLimit ミドルウェアで全リクエストに一律の
      #   ボディサイズ上限 (DefaultMaxBodyBytes) を適用しているため、実質的な保護は達成している。
      #   gosec G120 は関数単位のヒューリスティックで検出するため、ミドルウェアでラップしても
      #   ハンドラー内の r.FormValue / r.ParseForm は検出対象として残る。25+ 箇所に個別 nolint を
      #   散在させるより、ここで一括除外する方が管理コストが低く、保護している構造を明示できる。
      excludes:
        - G120
      # セキュリティの重要度（low, medium, high）
      severity: medium
      confidence: medium

    # depguard の設定
    depguard:
      rules:
        # Templates層のルール: ViewModelを通じてデータを表示
        # 直接のデータアクセスとビジネスロジックに依存しない
        templates-layer:
          files:
            - "**/internal/templates/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "TemplatesはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "TemplatesはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/model
              desc: "TemplatesはModelに直接依存できません。ViewModelを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "TemplatesはUseCaseに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "TemplatesはHandlerに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "TemplatesはMiddlewareに依存できません。"

        # ViewModel層のルール: データ変換のみ
        # 他のPresentation層パッケージに依存しない
        viewmodel-layer:
          files:
            - "**/internal/viewmodel/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "ViewModelはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "ViewModelはRepositoryに依存できません。ModelからViewModelへの変換を行ってください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "ViewModelはHandlerに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "ViewModelはMiddlewareに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "ViewModelはTemplatesに依存できません。"

        # Handler層のルール: HTTPリクエスト処理
        # QueryへのアクセスはRepositoryを経由、認可・バリデーションはUseCase経由
        handler-layer:
          files:
            - "**/internal/handler/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "HandlerはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "HandlerはRepositoryに直接依存できません。UseCaseまたはValidatorを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/policy
              desc: "HandlerはPolicyに直接依存できません。UseCaseを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/validator
              desc: "HandlerはValidatorに直接依存できません。UseCaseを経由してください。"

        # バリデーター層のルール: 形式チェック + DBの状態を使った検証
        # Repository/Modelは許可、query/usecaseへの依存禁止
        validator-layer:
          files:
            - "**/internal/validator/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "ValidatorはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "ValidatorはUseCaseに依存できません。"

        # Middleware層のルール
        # エラーページ・メンテナンスページ等のレンダリングのためTemplatesへの依存は許可
        middleware-layer:
          files:
            - "**/internal/middleware/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "MiddlewareはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "MiddlewareはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "MiddlewareはUseCaseに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "MiddlewareはHandlerに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "MiddlewareはViewModelに依存できません。"

        # Application層のルール（UseCase）
        # Presentation層に依存しない（メール送信はemail パッケージが担当し、UseCase は interface 経由で呼び出す）
        application-layer:
          files:
            - "**/internal/usecase/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "Application層はQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "Application層はPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "Application層はPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "Application層はPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "Application層はPresentation層に依存できません。テンプレートレンダリングはemailパッケージを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/session
              desc: "Application層はPresentation層のヘルパーに依存できません。トークン生成はauthパッケージを使用してください。"

        # Email層のルール: テンプレートレンダリング + メール送信
        # templates, i18n, Sender に依存可能。上位層や他のPresentation層パッケージに依存しない
        email-layer:
          files:
            - "**/internal/email/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "EmailはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "EmailはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "EmailはHandlerに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "EmailはMiddlewareに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "EmailはViewModelに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "EmailはUseCaseに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/validator
              desc: "EmailはValidatorに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/worker
              desc: "EmailはWorkerに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/dispatcher
              desc: "EmailはDispatcherに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/session
              desc: "EmailはSessionに依存できません。"

        # Model層のルール: 純粋なドメインエンティティ
        # データアクセス層、上位層に依存しない
        model-layer:
          files:
            - "**/internal/model/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "ModelはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "ModelはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "ModelはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "ModelはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "ModelはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "ModelはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "ModelはPresentation層に依存できません。"

        # Policy層のルール: 権限判定ロジック
        # Modelのみに依存し、データアクセス層と上位層に依存しない
        policy-layer:
          files:
            - "**/internal/policy/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "PolicyはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "PolicyはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "PolicyはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "PolicyはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "PolicyはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "PolicyはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "PolicyはPresentation層に依存できません。"

        # Markup層のルール: マークアップ処理ユーティリティ
        # データアクセス層と上位層に依存しない（インターフェースで抽象化）
        markup-layer:
          files:
            - "**/internal/markup/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "MarkupはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "MarkupはRepositoryに依存できません。インターフェースを使用してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "MarkupはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "MarkupはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "MarkupはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "MarkupはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "MarkupはPresentation層に依存できません。"

        # Repository層のルール: データアクセス層
        # 上位層に依存しない
        repository-layer:
          files:
            - "**/internal/repository/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "RepositoryはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "RepositoryはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "RepositoryはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "RepositoryはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "RepositoryはPresentation層に依存できません。"

        # Query層のルール: sqlc生成コード
        # 上位層に依存しない
        query-layer:
          files:
            - "**/internal/query/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "QueryはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/model
              desc: "QueryはModelに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "QueryはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "QueryはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "QueryはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "QueryはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "QueryはPresentation層に依存できません。"

        # Worker層のルール: バックグラウンドジョブ処理（Presentation層）
        # 他のPresentation層パッケージに依存しない
        worker-layer:
          files:
            - "**/internal/worker/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "WorkerはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "WorkerはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "WorkerはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "WorkerはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "WorkerはTemplatesに依存できません。メールレンダリングはUseCaseを経由してください。"

        # Dispatcher層のルール: ジョブキューへの投入を抽象化（Domain/Infrastructure層）
        # 上位層や同レイヤーの他パッケージに依存しない
        dispatcher-layer:
          files:
            - "**/internal/dispatcher/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "DispatcherはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/validator
              desc: "DispatcherはApplication層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/worker
              desc: "DispatcherはWorkerに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "DispatcherはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "DispatcherはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "DispatcherはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "DispatcherはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/policy
              desc: "DispatcherはPolicyに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "DispatcherはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "DispatcherはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/model
              desc: "DispatcherはModelに依存できません。"

        # RateLimit層のルール: インフラストラクチャユーティリティ
        # Queryに直接依存せず、Repositoryを経由する
        ratelimit-layer:
          files:
            - "**/internal/ratelimit/*.go"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "RateLimitはQueryに直接依存できません。Repositoryを経由してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "RateLimitはUseCaseに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "RateLimitはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "RateLimitはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "RateLimitはPresentation層に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "RateLimitはPresentation層に依存できません。"

        # auth層のルール: 横断的な技術ユーティリティ（Domain/Infrastructure層）
        # 標準ライブラリ・外部ライブラリのみに依存し、プロジェクト内部パッケージには依存しない
        auth-layer:
          files:
            - "**/internal/auth/**"
          deny:
            - pkg: github.com/wikinoapp/wikino/go/internal/query
              desc: "authはQueryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/repository
              desc: "authはRepositoryに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/model
              desc: "authはModelに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/usecase
              desc: "authはApplication層 (usecase) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/validator
              desc: "authはApplication層 (validator) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/handler
              desc: "authはPresentation層 (handler) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/middleware
              desc: "authはPresentation層 (middleware) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/viewmodel
              desc: "authはPresentation層 (viewmodel) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/templates
              desc: "authはPresentation層 (templates) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/worker
              desc: "authはPresentation層 (worker) に依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/session
              desc: "authはSessionに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/i18n
              desc: "authはI18nに依存できません。エラー種別はsentinel errorで返し、翻訳は呼び出し元で解決してください。"
            - pkg: github.com/wikinoapp/wikino/go/internal/dispatcher
              desc: "authはDispatcherに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/email
              desc: "authはEmailに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/policy
              desc: "authはPolicyに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/markup
              desc: "authはMarkupに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/clientip
              desc: "authはClientIPに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/config
              desc: "authはConfigに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/password_reset
              desc: "authはPasswordResetに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/ratelimit
              desc: "authはRateLimitに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/redirect
              desc: "authはRedirectに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/sidebar
              desc: "authはSidebarに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/timezone
              desc: "authはTimezoneに依存できません。"
            - pkg: github.com/wikinoapp/wikino/go/internal/turnstile
              desc: "authはTurnstileに依存できません。"

    # staticcheck の設定
    staticcheck:
      # 有効化するチェック（デフォルトですべて有効）
      checks: ["all", "-ST1003"] # ST1003: パッケージ名のアンダースコア警告を除外（ディレクトリ構造に由来）

# フォーマッター固有の設定（v2形式）
formatters:
  # 有効化するフォーマッター
  enable:
    - gofmt # Go標準フォーマッター
    - goimports # import文の整理

  # フォーマッター除外パス
  exclusions:
    paths:
      - bin/.*
      - vendor/.*
      - static/.*
      - node_modules/.*
      - '(.+)_templ\.go' # templ 自動生成ファイル

  settings:
    # goimports の設定
    goimports:
      # ローカルパッケージのプレフィックス
      local-prefixes:
        - github.com/wikinoapp/wikino/go

# 出力設定（v2形式）
output:
  formats:
    text:
      path: stdout
      colors: true
