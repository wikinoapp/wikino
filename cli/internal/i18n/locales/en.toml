other = "The {{.Name}} header cannot be set with `--header`."

[api_error_forbidden_header_hint]
description = "apiの--headerで認証のヘッダーなどを指定したときのヒント"
other = "The CLI adds the authentication header. Pass the token with `wikino auth login` or the `WIKINO_TOKEN` environment variable, and the host with `--host`."

