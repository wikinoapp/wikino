[confirm_prompt]
description = "取り消せない操作・公開の前に、続けるかを尋ねるプロンプト"
other = "Proceed? [y/N]:"

[error_response]
description = "送信済みの要求の応答を読み取り・解析できなかったときのメッセージ"
other = "Could not read or parse the API response."

[error_response_hint]
description = "送信済みの要求の応答を読み取り・解析できなかったときのヒント"
other = "The request has been sent. A write may have been applied, so check the result with a read command before running the same command again."

[error_edits_old_str_hint]
description = "検索置換で編集のold_strが本文に1件だけ一致しない (422) ときのヒント。Ordinalは何番目 (1始まり)、Indexは位置 (0始まり)、Commandは今の本文を確かめるコマンド"
other = "`old_str` of edit {{.Ordinal}} (`edits[{{.Index}}]`) does not match exactly one place in the body after the earlier edits are applied. No edit was applied. Check the current body with `{{.Command}}`, fix `old_str`, and send the whole `edits` again. To replace every matching place, set `replace_all` to `true`."

[error_edits_new_str_hint]
description = "検索置換で編集を適用すると本文が上限を超える (422) ときのヒント。Ordinalは何番目 (1始まり)、Indexは位置 (0始まり)"
other = "Applying edit {{.Ordinal}} (`edits[{{.Index}}]`) makes the body exceed the limit (1 MiB). No edit was applied. Reduce the edits and send the whole `edits` again."

# --dry-run
[dry_run_not_sent]
description = "--dry-runで要求を送らなかったことを標準エラーに出す案内"
other = "No requests were sent because of `--dry-run`."

# Wikiリンクのリンク先の確認
[wikilink_preview_error]
description = "本文を書き込む前のWikiリンクのリンク先の確認に失敗したときのメッセージ。MessageはAPIのエラーのメッセージ"
other = "Could not check where the wikilinks in the body point, so the write request was not sent: {{.Message}}"

[wikilink_preview_error_validation_failed_hint]
description = "Wikiリンクのリンク先の確認でトピックが無いか見られない (422) ときのヒント。Topicはトピック番号"
other = "Topic {{.Topic}} does not exist or cannot be seen. Check the topic number with `wikino topic list`."

[wikilink_will_create]
description = "--dry-runで、書き込むと作られるリンク先を標準エラーに出す案内。Countは件数、Pagesは「トピック名/タイトル」をカンマ区切りで並べたもの"
other = "Writing would create {{.Count}} linked pages that do not exist as unpublished pages: {{.Pages}}"

[wikilink_created]
description = "書き込みの後に、作られた見込みのリンク先を標準エラーに出す案内。Countは件数、Pagesは「トピック名/タイトル」をカンマ区切りで並べたもの"
other = "Estimated {{.Count}} linked pages that did not exist to have been created as unpublished pages: {{.Pages}}"

