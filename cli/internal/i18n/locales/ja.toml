[page_update_short]
description = "page updateコマンドの短い説明"
other = "ページを更新する"

[page_update_long]
description = "page updateコマンドの説明"
other = """
ページ番号で指定したページのタイトルと本文を更新します。
指定した項目だけを更新し、指定しなかった項目は変えません。

本文は、変更の大きさで次の3つの渡し方から選びます。

- `--body` か `--body-file`: 変えない部分も含めた本文の全体を渡します。`--body-file -` で標準入力から読みます。本文は渡したとおりに送り、末尾の改行も削りません
- `--md-file`: `wikino page get --md` で書き出して編集したページファイルを書き戻します。frontmatterの `wikino_etag` を版に、`wikino_title` をタイトルに使い、`wikino_` で始まるキーを取り除いた残りを本文として送ります
- `--edits`: 本文の一部だけを検索置換します。`{"edits": [{"old_str": "...", "new_str": "...", "replace_all": false}]}` の形のJSONを、ファイルか標準入力 (`-`) から読みます

`--body-file` にページファイルを渡すと、frontmatterも本文になります。
ページファイルは `--md-file` で渡してください。

`--md-file` のページファイルは次のように読みます。
`wikino_number` が引数のページ番号と違うファイルと、`wikino_etag` の無いファイルは受け付けません。
`wikino_title` が無ければタイトルを変えません。
他の `wikino_` のキー (公開状態・更新日時・URLなど) は読み取り専用で、書き換えても無視します。
本文自身のfrontmatter (`wikino_` で始まらないキー) は、本文の一部として残します。

`--edits` の各編集は、配列の順に、前の編集を適用した後の本文で `old_str` に一致する箇所を `new_str` に置き換えます。
`old_str` は大文字小文字・空白・改行も含めて本文と完全に一致する必要があります。
`replace_all` が `false` (既定) の編集は一致がちょうど1件でなければ失敗し、どの編集も適用しません。
`--edits` ではタイトルを変えられません。

更新には、読んだ版を `--if-match` で渡します。
版は `wikino page get` の出力の `etag` です。
読んだ後にページが更新されていると、上書きせずに終了コード6で失敗します。
`--force` を付けると版を照合せず、直前に取得した最新の版に上書きします。
他の人の変更を消しうるため、内容を読まずに上書きしてよいときだけ使ってください。
`--md-file` では版をファイルから読むため、`--if-match` と `--force` を付けません。
`--edits` では `--if-match` を省けます。
`old_str` が今の本文に一致すること自体が、読んだ本文を前提にしていることの確かめになるためです。
`--if-match` を付けると、読んだ版のままの本文にだけ適用します。

本文のWikiリンクが存在しないページを指すと、リンク先を未公開のページとして作成します。
本文を書き込む前にWikiリンクのリンク先を確かめ (`--edits` では各 `new_str` のリンク先を確かめます)、作成されるリンク先があれば、更新の後に標準エラーへ一覧を出します。
この一覧は更新の直前の見込みで、その間に他の利用者がページを作成・削除すると実際の結果とずれることがあります。
意図しないリンク先が無いかは、`--dry-run` で先に確かめられます。

まだ公開していないページを更新すると、そのページを公開します。
タイトルと本文が今と同じ場合は何も更新せず、今のページを出します。

非公開トピックのページを更新するには、トークンにpage:writeに加えてtopic:readのスコープが要ります。"""

[page_update_example]
description = "page updateコマンドの使用例"
other = """
  # ページ12の版を取得してから、本文をファイルの内容で更新する
  wikino page get 12 --jq .etag
  wikino page update 12 --body-file body.md --if-match '"d41d8cd9"'

  # ページ12のタイトルだけを変える
  wikino page update 12 --title '定例会議の議事録' --if-match '"d41d8cd9"'

  # ページ12をファイルに書き出し、編集してから書き戻す
  wikino page get 12 --md > page.md
  wikino page update 12 --md-file page.md

  # ページ12の本文の一部を検索置換する
  echo '{"edits": [{"old_str": "- [ ] 議事録を共有する", "new_str": "- [x] 議事録を共有する"}]}' | wikino page update 12 --edits -

  # 版を照合せず、最新の版に上書きする
  wikino page update 12 --body-file body.md --force

  # 送る要求と、本文のWikiリンクのリンク先を確かめる (送らない)
  wikino page update 12 --body-file body.md --if-match '"d41d8cd9"' --dry-run"""

[page_update_output]
description = "page updateコマンドのヘルプの「出力」の節"
other = """
  更新したページを、`wikino page get` と同じ項目 (`etag` を含む) で出します。
  `etag` は更新後の版で、続けて更新するときは `--if-match` に渡します。
  人間向けの表示では本文を出さず、完了の行を標準エラーに出します。
  本文のWikiリンクで作成した見込みのリンク先があれば、JSONの出力でも標準エラーに一覧を出します。
  `--dry-run` を付けると、更新の要求を送らずに `{"dry_run": true, "requests": [...], "wikilinks": [...]}` の形で送る要求と本文のWikiリンクのリンク先を出します。
  `wikilinks` の各要素は、Wikiリンクの文字列 (`text`)・リンク先のトピックの名前 (`topic_name`)・ページのタイトル (`page_title`)・解決の結果 (`resolution`)・既存のページ (`page`) を持ちます。
  `resolution` は、既存のページ (`existing_page`)・書き込むと未公開のページとして作られる (`new_page`)・トピックが無いか見られずリンクにならない (`topic_not_found`) のいずれかです。
  本文を書き込むときと `--force` を付けたときのページの取得と、リンク先の確認 (読み取り) の要求は、`--dry-run` でも送ります。
  `--dry-run` と `--fields` は併用できません。"""

[page_update_errors]
description = "page updateコマンドのヘルプの「エラー」の節"
other = """
  2  ページ番号が1以上の整数でない、`--title`・`--body`・`--body-file`・`--md-file`・`--edits` のどれも無い、同時に指定できないフラグを併用した、
     `--if-match` と `--force` のどちらも無いか両方ある (`--md-file`・`--edits` を除く)、`--if-match` が空か `*`、ファイルを読めないかUTF-8でない、
     `--md-file` の `wikino_number` がページ番号と違うか `wikino_etag` が無い、`--edits` のJSONの形が違う、`--fields` に未知の項目、`--dry-run` と `--fields` の併用
  3  ログインしていない、トークンが無効か期限切れ (401)
  4  トークンにpage:writeのスコープが無い (403)
  5  ページが無い、ゴミ箱にある、またはページを更新できない (404)。`wikino page list` で番号を確かめてください
  6  読んだ後にページが更新されている (412)。`wikino page get` で最新の内容と版を取得し、変更を反映してから更新し直してください。
     `--md-file` では、`wikino page get --md` で書き出し直したファイルに変更を反映してください
  7  タイトルに使えない文字がある、同じタイトルのページがトピックにある、タイトルの無い未公開のページを `--title` 無しで更新した (422)。
     `--edits` の `old_str` が今の本文に一致しないか、複数の箇所に一致した (422)。何番目の編集かをヒントに、一致の件数をメッセージに示します。
     `wikino page get --md` で今の本文を確かめ、`edits` の全体を送り直してください"""

