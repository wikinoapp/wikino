[draft_publish_long]
description = "draft publishコマンドの説明"
other = """
ページ番号で指定したページについて、自分の下書きのタイトルと本文でページを公開し、公開したページを出します。
公開すると、下書きを編集履歴ごと削除し、ページの編集履歴を1件作ります。
まだ公開していないページは公開済みになります。
ページの今の内容とは照合しないため、下書きを作った後にページが更新されていても、下書きの内容で上書きします。

公開には、読んだ下書きの版を `--if-match` で渡します。
版は `wikino draft get` の出力の `etag` です。
読んだ後に下書きが更新されていると (Web画面の自動保存を含みます)、公開せずに終了コード6で失敗します。
`--force` を付けると版を照合せず、直前に取得した最新の下書きを公開します。

公開の前に下書きを取得し、本文のWikiリンクのリンク先を確かめます。
本文のWikiリンクが存在しないページを指すと、リンク先を未公開のページとして作成します。
作成されるリンク先があれば、公開の後に標準エラーへ一覧を出します。
この一覧は公開の直前の見込みで、その間に他の利用者がページを作成・削除すると実際の結果とずれることがあります。

ページを公開する操作のため、`--yes` が無ければ公開の前に確認します。
確認では、今のページと比べたタイトルの変更と本文の増減の行数、作成されるリンク先、公開後に下書きが削除されることを示します。
端末から実行したときは、これらを示して尋ねます。
端末でないとき (エージェントやスクリプトから実行したとき) は、公開の要求を送らずに、何が起きるか (`changes`) と承認後に実行するコマンド (`confirm_command`) を標準出力にJSONで出し、終了コード9で終えます。
`changes` を利用者に見せ、承認を得てから `confirm_command` をそのまま実行してください。
`confirm_command` には、確認のために取得した版が `--if-match` で入っています。
タイトルの無い下書きは公開できないため、確認を求めずに終了コード7で失敗します。

公開するには、トークンにdraft_page:writeとpage:writeのスコープが要ります。
非公開トピックのページの下書きを公開するには、topic:readのスコープも要ります。"""

[draft_publish_example]
description = "draft publishコマンドの使用例"
other = """
  # ページ12の下書きを読んで版を確かめてから、公開の確認を求める
  wikino draft get 12 --md
  wikino draft publish 12 --if-match '"d41d8cd9"'

  # 利用者の承認を得た後に、確認を省いて公開する
  wikino draft publish 12 --if-match '"d41d8cd9"' --yes

  # 送る要求と、本文のWikiリンクのリンク先を確かめる (送らない)
  wikino draft publish 12 --if-match '"d41d8cd9"' --dry-run"""

[draft_publish_output]
description = "draft publishコマンドのヘルプの「出力」の節"
other = """
  公開したページを、`wikino page get` と同じ項目 (`etag` を含む) で出します。
  `etag` は公開後のページの版で、続けてページを更新するときは `--if-match` に渡します。
  人間向けの表示では本文を出さず、完了の行を標準エラーに出します。
  本文のWikiリンクで作成した見込みのリンク先があれば、JSONの出力でも標準エラーに一覧を出します。
  `--yes` が無く端末でないときは、公開せずに `{"status": "confirmation_required", "changes": [...], "confirm_command": "..."}` を出し、終了コード9で終えます。
  `--dry-run` を付けると、公開の要求を送らずに `{"dry_run": true, "requests": [...], "wikilinks": [...]}` の形で送る要求と本文のWikiリンクのリンク先を出します。確認は求めません。
  `wikilinks` の項目は `wikino page update` のヘルプを参照してください。
  下書きの取得とリンク先の確認 (読み取り) の要求は、`--dry-run` でも送ります。
  `--dry-run` と `--fields` は併用できません。"""

[draft_publish_errors]
description = "draft publishコマンドのヘルプの「エラー」の節"
other = """
  2  ページ番号が1以上の整数でない、`--if-match` と `--force` のどちらも無いか両方ある、`--if-match` が空か `*`、`--fields` に未知の項目、`--dry-run` と `--fields` の併用
  3  ログインしていない、トークンが無効か期限切れ (401)
  4  トークンにdraft_page:writeかpage:writeのスコープが無い、またはメンバーに下書きを保存しページを公開する権限が無い (403)
  5  ページに自分の下書きが無い、ページが無いかゴミ箱にある、または見られない非公開トピックのページ (404)。
     公開し直して5になった場合は、公開済みか下書きが削除されています。`wikino page get` でページを確かめてください
  6  読んだ後に下書きが更新されている (412)。`wikino draft get` で今の内容を確かめ、公開してよければ新しい版で公開し直してください
  7  下書きにタイトルが無い、タイトルに使えない文字がある、または同じタイトルのページがトピックにある (422)。
     `wikino draft update --title` で下書きのタイトルを直してから公開し直してください
  9  `--yes` が無く、利用者の確認が必要。端末では確認を拒否した"""

