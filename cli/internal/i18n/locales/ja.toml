other = """
コーディングエージェント (Claude Codeなど) 向けのスキルを扱います。

スキルは、Wikinoの概念と、ページを探して読む・書く・下書きを公開する・ログインする場面ごとの手順書をまとめたものです。
エージェントはスキルを読んで、このCLIの使い方と注意点を知ります。
スキルはこのCLIのバイナリに埋め込んでいるため、CLIと同じ版のスキルを書き出せます。"""

