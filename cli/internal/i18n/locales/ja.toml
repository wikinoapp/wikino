[draft_update_short]
description = "draft updateコマンドの短い説明"
other = "下書きを更新する"

[draft_update_long]
description = "draft updateコマンドの説明"
other = """
ページ番号で指定したページの自分の下書きのタイトルと本文を更新します。
指定した項目だけを更新し、指定しなかった項目は変えません。
ページは公開せず、公開済みのページの内容も変えません。
更新と同時に、下書きの編集履歴を1件作ります (直前の編集履歴と同じ内容なら作りません)。

本文は、変更の大きさで次の3つの渡し方から選びます。

- `--body` か `--body-file`: 変えない部分も含めた本文の全体を渡します。`--body-file -` で標準入力から読みます。本文は渡したとおりに送り、末尾の改行も削りません
- `--md-file`: `wikino draft get --md` で書き出して編集したページファイルを書き戻します。frontmatterの `wikino_etag` を版に、`wikino_title` をタイトルに使い、`wikino_` で始まるキーを取り除いた残りを本文として送ります
- `--edits`: 本文の一部だけを検索置換します。`{"edits": [{"old_str": "...", "new_str": "...", "replace_all": false}]}` の形のJSONを、ファイルか標準入力 (`-`) から読みます

`--md-file` と `--edits` の規則は `wikino page update` と同じです。
`--md-file` では、`wikino_number` が引数のページ番号と違うファイルと、`wikino_etag` の無いファイルを受け付けず、`wikino_title` が無ければタイトルを変えません。
`--edits` ではタイトルを変えられません。

更新には、読んだ版を `--if-match` で渡します。
版は `wikino draft get` の出力の `etag` です。
Web画面の自動保存でも版が変わるため、読んだ後に下書きが更新されていると、上書きせずに終了コード6で失敗します。
`--force` を付けると版を照合せず、直前に取得した最新の版に上書きします。
Web画面で書いている内容を消しうるため、内容を読まずに上書きしてよいときだけ使ってください。
`--md-file` では版をファイルから読むため、`--if-match` と `--force` を付けません。
`--edits` では `--if-match` を省けます。

本文のWikiリンクが存在しないページを指すと、リンク先を未公開のページとして作成します。
本文を書き込む前にWikiリンクのリンク先を確かめ (`--edits` では各 `new_str` のリンク先を確かめます)、作成されるリンク先があれば、更新の後に標準エラーへ一覧を出します。
この一覧は更新の直前の見込みで、その間に他の利用者がページを作成・削除すると実際の結果とずれることがあります。
意図しないリンク先が無いかは、`--dry-run` で先に確かめられます。

タイトルの規則 (トピック内で重複できないなど) は、下書きを公開するときに確かめます。

本文のリンク先を確かめるには、トークンにdraft_page:writeに加えてpage:readのスコープが要ります。
非公開トピックのページの下書きを更新するには、topic:readのスコープも要ります。"""

[draft_update_example]
description = "draft updateコマンドの使用例"
other = """
  # ページ12の下書きの版を取得してから、本文をファイルの内容で更新する
  wikino draft get 12 --jq .etag
  wikino draft update 12 --body-file body.md --if-match '"d41d8cd9"'

  # ページ12の下書きのタイトルだけを変える
  wikino draft update 12 --title '定例会議の議事録' --if-match '"d41d8cd9"'

  # ページ12の下書きをファイルに書き出し、編集してから書き戻す
  wikino draft get 12 --md > draft.md
  wikino draft update 12 --md-file draft.md

  # ページ12の下書きの本文の一部を検索置換する
  echo '{"edits": [{"old_str": "- [ ] 議事録を共有する", "new_str": "- [x] 議事録を共有する"}]}' | wikino draft update 12 --edits -

  # 送る要求と、本文のWikiリンクのリンク先を確かめる (送らない)
  wikino draft update 12 --body-file body.md --if-match '"d41d8cd9"' --dry-run"""

[draft_update_output]
description = "draft updateコマンドのヘルプの「出力」の節"
other = """
  更新した下書きを、`wikino draft get` と同じ項目 (`etag` を含む) で出します。
  `etag` は更新後の版で、続けて更新するときは `--if-match` に渡します。
  人間向けの表示では本文を出さず、完了の行を標準エラーに出します。
  本文のWikiリンクで作成した見込みのリンク先があれば、JSONの出力でも標準エラーに一覧を出します。
  `--dry-run` を付けると、更新の要求を送らずに `{"dry_run": true, "requests": [...], "wikilinks": [...]}` の形で送る要求と本文のWikiリンクのリンク先を出します。
  `wikilinks` の項目は `wikino page update` のヘルプを参照してください。
  本文を書き込むときと `--force` を付けたときの下書きの取得と、リンク先の確認 (読み取り) の要求は、`--dry-run` でも送ります。
  `--dry-run` と `--fields` は併用できません。"""

[draft_update_errors]
description = "draft updateコマンドのヘルプの「エラー」の節"
other = """
  2  ページ番号が1以上の整数でない、`--title`・`--body`・`--body-file`・`--md-file`・`--edits` のどれも無い、同時に指定できないフラグを併用した、
     `--if-match` と `--force` のどちらも無いか両方ある (`--md-file`・`--edits` を除く)、`--if-match` が空か `*`、ファイルを読めないかUTF-8でない、
     `--md-file` の `wikino_number` がページ番号と違うか `wikino_etag` が無い、`--edits` のJSONの形が違う、`--fields` に未知の項目、`--dry-run` と `--fields` の併用
  3  ログインしていない、トークンが無効か期限切れ (401)
  4  トークンにdraft_page:writeのスコープが無い、本文のリンク先の確認でpage:readのスコープが無い (403)
  5  ページに自分の下書きが無い、ページが無いかゴミ箱にある、または見られない非公開トピックのページ (404)。
     `wikino draft list` で番号を確かめ、下書きが無ければ `wikino draft create` で作成してください
  6  読んだ後に下書きが更新されている (412)。`wikino draft get` で最新の内容と版を取得し、変更を反映してから更新し直してください。
     `--md-file` では、`wikino draft get --md` で書き出し直したファイルに変更を反映してください
  7  タイトルや本文が長すぎるなど入力が不正 (422)。
     `--edits` の `old_str` が今の本文に一致しないか、複数の箇所に一致した (422)。何番目の編集かをヒントに、一致の件数をメッセージに示します。
     `wikino draft get --md` で今の本文を確かめ、`edits` の全体を送り直してください"""

[draft_update_title_flag]
description = "draft updateの--titleフラグの説明。バッククォートで囲んだ語はヘルプで値の名前として表示される"
other = "下書きの新しいタイトル (`title`)"

