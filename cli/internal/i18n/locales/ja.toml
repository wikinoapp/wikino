other = "スキルを書き出す"

[skill_install_long]
description = "skill installコマンドの説明"
other = """
このCLIに埋め込んだスキル (SKILL.mdと手順書) を、スキルを置くディレクトリの下の `wikino/` に書き出します。

既定の書き出し先は、Claude Codeのユーザー単位のスキルのディレクトリ (`$CLAUDE_CONFIG_DIR/skills/`、未設定なら `~/.claude/skills/`) です。
ほかのエージェントで使うときは、`--dir` でそのエージェントがスキルを読むディレクトリを指定します。
リポジトリの `.claude/skills/` はそのリポジトリの開発用のスキルを置く場所のため、既定にしていません。

スキルは表示言語 (`WIKINO_LANG`・`LC_ALL`・`LC_MESSAGES`・`LANG`) で書き出し、日本語以外は英語にします。
`wikino/` に既にあるスキルのファイルは上書きし、ほかのファイルは残します。
CLIを更新したときは、もう一度実行してスキルも更新してください。"""

