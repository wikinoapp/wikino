  # トピック3の「議事録」というタイトルのページの番号を調べる
  wikino page list --topic 3 --title '議事録' --jq '.items[].number'

  # 指定した日時以降に更新されたページを、本文を含めて1行1件で出す
  wikino page list --modified-since 2026-10-01T00:00:00Z --all --fields number,title,body"""

