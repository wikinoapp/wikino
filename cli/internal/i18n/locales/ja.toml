[auth_warning_revoke_failed]
description = "ログアウトでリフレッシュトークンを失効させられなかったときの警告。Spaceはスペースの識別子"
other = "警告: サーバーでトークンを失効させられませんでした。手元の資格情報は消しました。スペース {{.Space}} の連携中のアプリの画面で連携を解除してください。"
[auth_logout_short]
description = "auth logoutコマンドの短い説明"
other = "保存した資格情報を消す"

[auth_logout_long]
description = "auth logoutコマンドの説明"
other = """
保存した資格情報 (トークンと設定の組) を消します。

対象は、ほかのコマンドと同じ順で決めます。
`<space>` は `--space` と同じ意味です。
同じスペースに複数のメンバーの資格情報があるときは、`--member` で選びます。

ブラウザでログインした資格情報は、リフレッシュトークンをサーバーで失効させてから消します。
失効できなかったとき (接続先に届かないなど) も手元の資格情報は消し、標準エラーに警告を出します。
そのときはWikinoの連携中のアプリの画面で連携を解除してください。

個人アクセストークンはサーバーでは失効させません。
トークンを使えなくするには、スペース設定でトークンを削除してください。
`WIKINO_TOKEN` のトークンは保存していないため、このコマンドの対象になりません。

既定の組を消したときは、既定を外します。"""
[auth_logout_example]
description = "auth logoutコマンドの使用例"
other = """
  # スペースmy-spaceの資格情報を消す
  wikino auth logout my-space

  # 同じスペースの別のメンバーの資格情報を消す
  wikino auth logout my-space --member bot"""

[auth_logout_output]
description = "auth logoutコマンドのヘルプの「出力」の節"
other = "  消した資格情報を `wikino auth login` と同じ項目で出します。default・space_defaultは消す前の値です。"

[auth_logout_errors]
description = "auth logoutコマンドのヘルプの「エラー」の節"
other = """
  2  スペースやメンバーが決まらない (候補をヒントに出します)
  3  指定したスペース・メンバーの資格情報が無い
  1  トークンや設定を削除できない。資格情報を設定に残し、ログアウトを再試行できます。"""

[auth_status_short]
description = "auth statusコマンドの短い説明"
other = "資格情報とトークンを確かめる"

[auth_status_long]
description = "auth statusコマンドの説明"
other = """
保存した資格情報ごとに、接続先・スペース・メンバーと、トークンの種類・スコープ・有効期限をAPIから取得して出します。

`--host`・`--space`・`--member` を指定すると、一致する資格情報だけを出します。
`WIKINO_TOKEN` にトークンを渡しているときは、保存した資格情報の代わりにそのトークンを確かめます (`--space` か `WIKINO_SPACE` が要ります)。

操作の前に、トークンに必要なスコープが付いているかを確かめるときに使います。
実際に操作できるかは、スコープに加えてメンバーの権限でも決まります。"""

[auth_status_example]
description = "auth statusコマンドの使用例"
other = """
  # 保存したすべての資格情報を確かめる
  wikino auth status

  # スペースmy-spaceのトークンのスコープだけを出す
  wikino auth status --space my-space --jq '.items[].token.scopes'"""

[auth_status_output]
description = "auth statusコマンドのヘルプの「出力」の節"
other = """
  `{"items": [...]}` の形で、資格情報ごとに次の項目を出します。
    host・space・member・default・space_default  `wikino auth login` と同じ
