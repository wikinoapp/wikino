  人間向けの表示では本文を出さず、完了の行を標準エラーに出します。
  本文のWikiリンクで作成した見込みのリンク先があれば、JSONの出力でも標準エラーに一覧を出します。
  `--dry-run` を付けると、作成の要求を送らずに `{"dry_run": true, "requests": [...], "wikilinks": [...]}` の形で送る要求と本文のWikiリンクのリンク先を出します。
  `wikilinks` の項目は `wikino page create` のヘルプを参照してください。
  既存のページのリンク先の確認に要るページの取得と、リンク先の確認 (どちらも読み取り) の要求は、`--dry-run` でも送ります。
  `--dry-run` と `--fields` は併用できません。"""

[draft_create_errors]
description = "draft createコマンドのヘルプの「エラー」の節"
other = """
  1  通信に失敗した、サーバーのエラー (5xx)。作成されている場合があります。
     既存のページでは `wikino draft get <ページ番号>` で、新しいページでは `wikino draft list` で確かめてから送り直してください
  2  ページ番号と `--topic` のどちらも無いか両方ある、ページ番号か `--topic` が1以上の整数でない、`--body` と `--body-file` の両方がある、
     本文のファイルを読めないかUTF-8でない、`--fields` に未知の項目、`--dry-run` と `--fields` の併用
  3  ログインしていない、トークンが無効か期限切れ (401)
  4  トークンにdraft_page:writeのスコープが無い、新しいページでpage:writeのスコープが無い、本文のリンク先の確認でpage:readのスコープが無い (403)
