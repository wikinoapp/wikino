description = "page listコマンドの短い説明"
other = "ページの一覧を出す"

[page_list_long]
description = "page listコマンドの説明"
other = """
スペースのページを、更新日時の新しい順に出します。
ゴミ箱に入れたページは含みません。

既定では公開済みのページだけを出します。
`--status unpublished` か `--status all` で、Wikiリンクで自動作成されたページなど、まだ公開していないページも出せます。
未公開のページは、見られるトピックの公開済みページか、自分の下書きからWikiリンクで指しているものだけを含みます。
リンクされていない未公開ページは含みません。

一覧には本文を出さず、本文の冒頭の抜粋 (`excerpt`) を出します。
本文を読むには `wikino page get` を使います。
一覧に本文が要るときは、`--fields` に `body` を含めます。

既定ではAPIの既定の件数 (20件) の1ページだけを取得します。
次のページがあるときは、取り方を標準エラーに出します。
`--all` を付けると全件を取得し、出力の形がJSON Linesに変わります (「出力」を参照)。

非公開トピックのページは、トークンにtopic:readのスコープがあり、メンバーがそのトピックを見られる場合にだけ含みます。"""

