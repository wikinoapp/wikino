other = "添付ファイルを保存する"

[attachment_get_long]
description = "attachment getコマンドの説明"
other = """
IDで指定した添付ファイルの中身を取得し、ファイルに保存します。
IDは、本文の `/attachments/{ID}` のIDです。`/attachments/` を付けたままでも渡せます。

既定では、カレントディレクトリに元のファイル名で保存します。
元のファイル名は、パスの区切り・制御文字・先頭と末尾の `.` を取り除くなど、保存先のディレクトリの中の1つのファイルを指す名前に整えてから使います。
