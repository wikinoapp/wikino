description = "draft createコマンドの説明"
other = """
ページを公開せずに書き換えるための下書きを作成します。
作成と同時に、下書きの編集履歴を1件作ります。

既存のページの下書きは、ページ番号を引数に渡して作成します。
`--title` と本文を省くと、ページの今のタイトルと本文を下書きにします。
ページに自分の下書きが既にあるときは作成できません。
`wikino draft get` で今の下書きを読み、`wikino draft update` で更新してください。

新しいページの下書きは、ページ番号の代わりに `--topic` でトピックを指定して作成します。
Web画面での作成と同じく、タイトルと本文の無い未公開のページを作り、その下書きを作ります。
`--title` を省くとタイトルの無い下書きに、本文を省くと本文の空の下書きになります。
出力の `page_number` が新しいページの番号です。

本文は `--body` か `--body-file` で渡し、`--body-file -` で標準入力から読みます。
本文は渡したとおりに送り、末尾の改行も削りません。
タイトルの規則 (トピック内で重複できないなど) は、下書きを公開するときに確かめます。

本文のWikiリンクが存在しないページを指すと、リンク先を未公開のページとして作成します。
本文を渡したときは、作成の前に本文のWikiリンクのリンク先を確かめ、作成されるリンク先があれば、作成の後に標準エラーへ一覧を出します。
この一覧は作成の直前の見込みで、その間に他の利用者がページを作成・削除すると実際の結果とずれることがあります。
意図しないリンク先が無いかは、`--dry-run` で先に確かめられます。

新しいページの下書きの作成は冪等ではありません。
結果が分からないとき (通信の失敗など) は、送り直す前に `wikino draft list` で作成済みかを確かめてください。

新しいページの下書きを作成するには、トークンにdraft_page:writeに加えてpage:writeのスコープが要ります。
本文のリンク先を確かめるには、page:readのスコープが要ります。
非公開トピックのページの下書きを作成するには、topic:readのスコープも要ります。"""

