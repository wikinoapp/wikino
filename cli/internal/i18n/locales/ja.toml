# 日本語翻訳ファイル (正本)
#
# キーの分類はサーバーの翻訳ファイルと同じ考え方で、ページ名の代わりにコマンドの名前で区切る。
# - {コマンド}_*: 特定のコマンドのヘルプ (例: root_*はwikinoのルートコマンド)
# - help_*: すべてのコマンドのヘルプで共通の見出しやフラグ
# - usage_error_*: 使い方の誤り (終了コード2) のメッセージとヒント
# - exit_code_*: 終了コードの表に載せる、各終了コードの意味
# - error_*: 使い方の誤り以外の、複数のコマンドで共通のエラーのメッセージとヒント
# - list_*: 一覧を返すコマンドに共通の、標準エラーへの案内
# - confirm_*: 取り消せない操作・公開の前の確認
# - dry_run_*: `--dry-run` で要求を送らなかったことの案内
# - wikilink_*: 本文を書き込む前のWikiリンクのリンク先の確認と、作られるリンク先の案内
# - command_table_*: スキル (SKILL.md) に載せる、コマンド定義から生成するコマンドの一覧表

# ルートコマンド
[root_short]
description = "ルートコマンドの短い説明"
other = "Wikinoのコマンドラインツール"

[root_long]
description = "ルートコマンドの説明"
other = "Wikinoの公開APIを呼んで、ページや下書きを読み書きするコマンドラインツールです。"

[root_example]
description = "ルートコマンドの使用例"
other = """
  # バージョンを表示する
  wikino --version"""

[root_version_flag]
description = "--versionフラグの説明"
other = "バージョンを表示する"

[root_output]
description = "ルートコマンドのヘルプの「出力」の節。すべてのコマンドに共通の出力の規則"
other = """
  標準出力がTTYなら人間向けの表示を、TTYでないか `--json` を付けたときはJSONを出します。
  `--fields` で項目を選んだときと、`--jq` を付けたときもJSONを出します。
  標準出力には結果だけを出し、進捗や警告は標準エラーに出します。"""

[root_errors]
description = "ルートコマンドのヘルプの「エラー」の節。ExitCodesは終了コードの表"
other = """
  終了コードで失敗の種類を区別します。
{{.ExitCodes}}

  標準エラーがTTYでないか `--json` を付けたときは、エラーを標準エラーに1行のJSONで出します。
    {"error": {"code": "usage_error", "message": "...", "hint": "...", "status": 412}}
  `hint` は次に何をするかを表します。`status` はAPIの応答のHTTPステータスで、APIに由来しないエラーでは省きます。"""

# authコマンド
[auth_short]
description = "authコマンドの短い説明"
other = "ログインと資格情報を扱う"

[auth_long]
description = "authコマンドの説明"
other = """
Wikinoのスペースへのログインと、保存した資格情報を扱います。

資格情報は、接続先・スペース・メンバーの組ごとに保存します。
トークンはOSのキーチェーンに保存し、使えない環境では設定のディレクトリ (`$XDG_CONFIG_HOME/wikino/`、未設定なら `~/.config/wikino/`) の0600のファイルに保存します。
`WIKINO_TOKEN_STORE=file` でファイルへの保存を強制できます。

コマンドを実行するときは、次の順で接続先・スペース・メンバーを決めます。
  接続先: `--host` → `WIKINO_HOST` → 既定の接続先 → https://wikino.app
  スペース: `--space` → `WIKINO_SPACE` → 既定のスペース → 資格情報のあるスペースが1つならそれ
  メンバー: `--member` → `WIKINO_MEMBER` → そのスペースの既定のメンバー → そのスペースの資格情報が1つならそれ

`WIKINO_TOKEN` にトークンを渡すと、保存した資格情報より優先して使い、ディスクに何も書きません。
そのときは `--space` か `WIKINO_SPACE` でスペースを指定し、`--member` と `WIKINO_MEMBER` は指定しません。"""

[auth_example]
description = "authコマンドの使用例"
other = """
  # ブラウザで許可してログインする
  wikino auth login my-space

  # SSH先などで、別の端末のブラウザでコードを入力してログインする
  wikino auth login my-space --device

  # 個人アクセストークンを標準入力から渡してログインする
  wikino auth login my-space --with-token < token.txt

  # 保存した資格情報とトークンのスコープを確かめる
  wikino auth status"""
[auth_output]
description = "authコマンドのヘルプの「出力」の節"
other = "  各サブコマンドのヘルプを参照してください。"

[auth_errors]
description = "authコマンドのヘルプの「エラー」の節"
other = "  サブコマンドが無いときと未知のサブコマンドは、使い方の誤り (終了コード2) で失敗します。"

[auth_login_short]
description = "auth loginコマンドの短い説明"
other = "スペースにログインする"

[auth_login_long]
description = "auth loginコマンドの説明"
other = """
スペースにログインし、資格情報を保存します。

既定では、ブラウザでWikinoの認可画面を開き、許可を受けてトークンを得ます (OAuth)。
認可画面のURLは標準エラーにも出すため、ブラウザが開かないときはそのURLを開いてください。
許可を待つのは5分までです。

SSHで接続しているとき、ディスプレイが無いとき、ブラウザの起動やポートの待ち受けに失敗したときは、デバイス認可に切り替えます。
`--device` を付けると、常にデバイス認可でログインします。
デバイス認可では、確認用のURLとコードを標準エラーに出すため、手元の端末のブラウザでそのURLを開き、コードを入力して許可してください。
許可を待つのは、コードの期限 (Wikinoでは10分) までです。

要求するスコープの既定はトークンに付与できるすべてのスコープで、付与する範囲は認可画面で選べます。
要求を絞るときは `--scopes` で指定します。
OAuthのアクセストークンは、期限の少し前に、APIを呼ぶ前に自動で更新します。

`--with-token` を付けると、スペース設定で発行した個人アクセストークンを標準入力から読みます。

どちらの方法でも、トークンがそのスペースで使えることをAPIで確かめてから保存し、確かめられなければ何も保存しません。
ブラウザでログインしたときは、保存しなかったトークンをサーバーで失効させます。
トークンの持ち主のメンバーはトークンから決まるため、`--member` は指定しません。

既定の組が無ければ、ログインした組を既定にします。
スペースに既定のメンバーが無ければ、ログインしたメンバーをそのスペースの既定にします。
同じメンバーで再びログインすると、保存したトークンを置き換えます。"""
[auth_login_example]
description = "auth loginコマンドの使用例"
other = """
  # ブラウザで許可してログインする
  wikino auth login my-space

  # SSH先などで、別の端末のブラウザでコードを入力してログインする
  wikino auth login my-space --device

  # 読み取りと下書きのスコープだけを要求する
  wikino auth login my-space --scopes page:read,draft_page:read,draft_page:write

  # ファイルに保存した個人アクセストークンでログインする
  wikino auth login my-space --with-token < token.txt

  # 開発環境のサーバーにログインする
  wikino auth login my-space --host http://localhost:4000"""
[auth_login_output]
description = "auth loginコマンドのヘルプの「出力」の節"
other = """
  ログインした資格情報を出します。
    host           接続先のURL
    space          スペースの識別子
    member         メンバー (id・atname・name)
    token_store    トークンの保存先 (keyring・file)
    default        既定の組かどうか
    space_default  そのスペースの既定のメンバーかどうか
    scopes         ブラウザでログインしたときに付与されたスコープ (`--with-token` では出しません)
  認可画面のURL、デバイス認可の確認用のURLとコード、キーチェーンを使えずファイルに保存したときの警告は、標準エラーに出します。"""
[auth_login_errors]
description = "auth loginコマンドのヘルプの「エラー」の節"
other = """
  2  スペースの指定が無い、`--member` を指定した、`--scopes` が空か未知のスコープを含む、`--with-token` と `--scopes` か `--device` を併用した、標準入力のトークンが空か不正な形式
  3  認可画面で拒否した (authorization_denied)、認可の応答が要求と一致しない・認可サーバーがエラーを返した・デバイス認可に対応しない (oauth_error)、トークンが無効か期限切れ (401)
  5  トークンがそのスペースのものでない (404)。トークンを発行したスペースの識別子を指定してください
  1  5分以内、またはデバイス認可のコードの期限までに許可されなかった (login_timeout)、認可サーバーの応答を読めない (response_error)、通信に失敗した、トークンか設定の保存、または保存の失敗後の復元に失敗した
  APIの検証に失敗したときは何も保存しません。
  以前の保存先からの削除だけが失敗したときは、ログインを成功にして警告を出し、再ログインかログアウトで削除を再試行できます。"""
[auth_login_with_token_flag]
description = "auth loginの--with-tokenフラグの説明"
other = "標準入力から個人アクセストークンを読む"


[auth_login_device_flag]
