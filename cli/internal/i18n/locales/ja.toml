# apiコマンド
[api_short]
description = "apiコマンドの短い説明"
other = "公開APIを認証付きで直接呼ぶ"

[api_long]
description = "apiコマンドの説明"
other = """
公開API (`/api/v1`) を、ログイン中の資格情報で直接呼びます。
CLIにまだコマンドの無い操作に使います。

<path> は `/api/v1` からのパスで、クエリを含められます (例: /spaces/{space}/pages?limit=5)。
パスの `{space}` は、コマンドを実行するスペース (`--space`・`WIKINO_SPACE`・既定のスペース) の識別子に置き換えます。
URL・`/api/v1` から始まるパス・`..` を含むパスは受け付けません。

`--input` の本文は、`--header` でContent-Typeを指定しなければ、PATCHではJSON Merge Patch (`application/merge-patch+json`)、それ以外ではJSONとして送ります。
取り消せない操作や公開など、利用者の確認が要る操作は、`--yes` が無ければ送りません。
非TTYでは、何が起きるか (`changes`) と承認後に実行するコマンド (`confirm_command`) をJSONで出し、終了コード9で終えます。
`--dry-run` を付けると、公開APIへの要求は読み取りの要求も含めて送らずに、送る要求を出します。

APIの操作とパスは、`wikino api GET /openapi.yaml` で取得できるOpenAPI記述で確かめられます。"""

[api_example]
description = "apiコマンドの使用例"
other = """
  # ページの一覧を5件だけ取得する
  wikino api GET '/spaces/{space}/pages?limit=5'

  # ページ12のタイトルを変える (版は `wikino page get 12` のetag)
  echo '{"title": "定例会議"}' | wikino api PATCH '/spaces/{space}/pages/12' --input - --header 'If-Match: "d41d8cd9"'

  # 送る要求を、送らずに確かめる
  wikino api POST '/spaces/{space}/pages' --input page.json --dry-run

  # OpenAPI記述を取得する
  wikino api GET /openapi.yaml"""

[api_output]
description = "apiコマンドのヘルプの「出力」の節"
other = """
  成功の応答の本文を、APIが返した形のまま出します (CLIが加える項目はありません)。
  JSONの応答は、TTYでは字下げして出します。`--jq` を付けると、応答のJSONに適用した結果を出します。
  本文の無い応答 (204など) では何も出しません。
  `--dry-run` では、送る要求を {"dry_run": true, "requests": [{"method", "url", "headers", "body"}]} の形で出します。Authorizationの値は伏せます。
  失敗の応答 (4xx・5xx) は、ほかのコマンドと同じく標準エラーにエラーとして出します。"""

[api_errors]
description = "apiコマンドのヘルプの「エラー」の節"
other = """
  1  サーバーのエラー (5xx)・通信の失敗、JSONでない応答に `--jq` を付けた
  2  使えないメソッド、`/api/v1` からのパスでない (URL・`..` を含む)、`--header` の誤りや認証のヘッダーの指定、`--fields` の指定、GETに `--input`、`--input` のファイルを読めない、確認が要る操作に `--input -`
  3  ログインしていない、トークンが無効か期限切れ (401)
  4  トークンのスコープが足りない (403)
  5  パスに当たるものが無い (404)
  6  競合 (409)、版の不一致 (412)、版の欠落 (428)。`If-Match` は `--header` で渡してください
  7  本文の誤り (400・422)
  8  レート制限 (429)
  9  利用者の確認が要る操作 (下書きの削除・公開) に `--yes` が無い"""

[api_input_flag]
description = "api --inputフラグの説明。バッククォートで囲んだ語はヘルプで値の名前として表示される"
other = "要求の本文を読むファイル (`file`。- で標準入力)"

