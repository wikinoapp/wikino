[page_create_short]
description = "page createコマンドの短い説明"
other = "ページを作成する"

[page_create_long]
description = "page createコマンドの説明"
other = """
トピック番号で指定したトピックに、タイトルと本文でページを作成して公開します。

本文は `--body` か `--body-file` のどちらかで渡します。
空のページを作るときも `--body ''` と明示します。
`--body-file -` で標準入力から読みます。
本文は渡したとおりに送り、末尾の改行も削りません。

同じタイトルで本文の無い未公開のページ (Wikiリンクで自動作成されたページなど) があれば、新しいページを作らずにそのページに本文を書いて公開します。
このとき出力の `number` はそのページの番号です。

本文のWikiリンクが存在しないページを指すと、リンク先を未公開のページとして作成します。
作成の前に本文のWikiリンクのリンク先を確かめ、作成されるリンク先があれば、作成の後に標準エラーへ一覧を出します。
この一覧は作成の直前の見込みで、その間に他の利用者がページを作成・削除すると実際の結果とずれることがあります。
意図しないリンク先が無いかは、`--dry-run` で先に確かめられます。

ページの作成は冪等ではありません。
結果が分からないとき (通信の失敗など) は、送り直す前に `wikino page list --topic <番号> --title <タイトル>` で作成済みかを確かめてください。

既にあるページの内容を変えるには `wikino page update` を使います。
非公開トピックにページを作成するには、トークンにpage:writeに加えてtopic:readのスコープが要ります。"""

[page_create_example]
description = "page createコマンドの使用例"
other = """
  # トピック3に「議事録」というページを作成する
  wikino page create --topic 3 --title '議事録' --body '# 議事録'

  # ファイルの内容を本文にしてページを作成する
  wikino page create --topic 3 --title '議事録' --body-file minutes.md

  # 標準入力から本文を読み、作成したページの番号と版だけを出す
  cat minutes.md | wikino page create --topic 3 --title '議事録' --body-file - --fields number,etag

  # 送る要求と、本文のWikiリンクのリンク先を確かめる (送らない)
  wikino page create --topic 3 --title '議事録' --body-file minutes.md --dry-run"""

[page_create_output]
description = "page createコマンドのヘルプの「出力」の節"
other = """
  作成したページを、`wikino page get` と同じ項目 (`etag` を含む) で出します。
  続けて更新するときは、`etag` を `wikino page update` の `--if-match` に渡します。
  人間向けの表示では本文を出さず、完了の行を標準エラーに出します。
  本文のWikiリンクで作成した見込みのリンク先があれば、JSONの出力でも標準エラーに一覧を出します。
  `--dry-run` を付けると、作成の要求を送らずに `{"dry_run": true, "requests": [...], "wikilinks": [...]}` の形で送る要求と本文のWikiリンクのリンク先を出します。
  `wikilinks` の各要素は、Wikiリンクの文字列 (`text`)・リンク先のトピックの名前 (`topic_name`)・ページのタイトル (`page_title`)・解決の結果 (`resolution`)・既存のページ (`page`) を持ちます。
  `resolution` は、既存のページ (`existing_page`)・書き込むと未公開のページとして作られる (`new_page`)・トピックが無いか見られずリンクにならない (`topic_not_found`) のいずれかです。
  リンク先の確認 (読み取り) の要求は、`--dry-run` でも送ります。
  `--dry-run` と `--fields` は併用できません。"""

[page_create_errors]
description = "page createコマンドのヘルプの「エラー」の節"
other = """
  1  通信に失敗した、サーバーのエラー (5xx)。作成されている場合があるため、`wikino page list --topic <番号> --title <タイトル>` で確かめてから送り直してください
  2  `--topic` か `--title` が無い、`--body` と `--body-file` のどちらも無いか両方ある、`--topic` が1以上の整数でない、
     本文のファイルを読めないかUTF-8でない、`--fields` に未知の項目、`--dry-run` と `--fields` の併用
  3  ログインしていない、トークンが無効か期限切れ (401)
  4  トークンにpage:writeのスコープが無い (403)
  5  トピックにページを作成できない (404)
  7  タイトルに使えない文字がある、同じタイトルのページがトピックにある、トピックが無いか見られない (422)。
     重複のときは `wikino page list --topic <番号> --title <タイトル>` で既存のページを探し、内容を変えるなら `wikino page update` を使ってください"""

