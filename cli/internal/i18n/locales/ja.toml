[draft_delete_short]
description = "draft deleteコマンドの短い説明"
other = "下書きを削除する"

[draft_delete_long]
description = "draft deleteコマンドの説明"
other = """
ページ番号で指定したページの自分の下書きを、編集履歴ごと削除します。
削除した下書きと編集履歴は元に戻せません。
ページそのものは削除せず、公開済みのページの内容も変えません。

削除には、読んだ版を `--if-match` で渡します。
版は `wikino draft get` の出力の `etag` です。
読んだ後に下書きが更新されていると (Web画面の自動保存を含みます)、削除せずに終了コード6で失敗します。
`--force` を付けると版を照合せず、直前に取得した最新の版を削除します。

取り消せない操作のため、`--yes` が無ければ削除の前に確認します。
端末から実行したときは、削除する下書きと編集履歴の件数を示して尋ねます。
端末でないとき (エージェントやスクリプトから実行したとき) は、削除の要求を送らずに、何が起きるか (`changes`) と承認後に実行するコマンド (`confirm_command`) を標準出力にJSONで出し、終了コード9で終えます。
`changes` を利用者に見せ、承認を得てから `confirm_command` をそのまま実行してください。
`confirm_command` には、確認のために取得した版が `--if-match` で入っています。

削除するには、トークンにdraft_page:deleteのスコープが要ります。
確認と `--force` のために下書きと編集履歴を読むには、draft_page:readのスコープも要ります。
非公開トピックのページの下書きを削除するには、topic:readのスコープも要ります。"""

[draft_delete_example]
description = "draft deleteコマンドの使用例"
other = """
  # ページ12の下書きを読んで版を確かめてから、削除の確認を求める
  wikino draft get 12 --md
  wikino draft delete 12 --if-match '"d41d8cd9"'

  # 利用者の承認を得た後に、確認を省いて削除する
  wikino draft delete 12 --if-match '"d41d8cd9"' --yes

  # 送る要求を確かめる (送らない)
  wikino draft delete 12 --if-match '"d41d8cd9"' --dry-run"""

