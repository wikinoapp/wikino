  `--yes` が無く端末でないときは、削除せずに `{"status": "confirmation_required", "changes": [...], "confirm_command": "..."}` を出し、終了コード9で終えます。
  `--dry-run` を付けると、削除の要求を送らずに `{"dry_run": true, "requests": [...]}` の形で送る要求を出します。確認は求めません。
  `--force` を付けたときの下書きの取得 (読み取り) の要求は、`--dry-run` でも送ります。
  `--dry-run` と `--fields` は併用できません。"""

