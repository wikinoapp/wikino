既存のファイルは上書きせずに失敗し、`--clobber` を付けたときだけ上書きします。

中身は、APIが返す短命の署名付きURLから、トークンを付けずに取得します。"""

[attachment_get_example]
description = "attachment getコマンドの使用例"
other = """
  # 添付ファイルをカレントディレクトリに元のファイル名で保存する
