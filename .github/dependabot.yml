# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Go version dependencies
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "daily"

  # Go version npm dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/go"
    schedule:
      interval: "daily"
    groups:
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        # メジャーは破壊的変更を含むことがあり個別 PR でレビューしたいため、
        # グループ PR には patch / minor のみを含める
        update-types:
          - "patch"
          - "minor"
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
          - "codemirror"
        # メジャーは破壊的変更を含むことがあり個別 PR でレビューしたいため、
        # グループ PR には patch / minor のみを含める
        update-types:
          - "patch"
          - "minor"

  # Rails version bundler dependencies
  - package-ecosystem: "bundler"
    directory: "/rails"
    schedule:
      interval: "daily"
    # Rails 版はメンテナンスモードに入っており、Dependabot alerts に基づく
    # セキュリティアップデートのみ対応する。通常の version update PR は作らない
    open-pull-requests-limit: 0

  # Rails version npm dependencies
  - package-ecosystem: "npm"
    directory: "/rails"
    schedule:
      interval: "daily"
    # Rails 版はメンテナンスモードに入っており、Dependabot alerts に基づく
    # セキュリティアップデートのみ対応する。通常の version update PR は作らない
    open-pull-requests-limit: 0

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
