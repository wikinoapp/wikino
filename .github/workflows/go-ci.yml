name: Go CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"

env:
  GO_VERSION: "1.26.4"
  NODE_VERSION: "24.13.0"
  # dbmateはリリースバイナリからインストールする (Dockerfile群と同じ方法)。
  # 浮動参照である `releases/latest` は使わず、バージョンとハッシュを必ず固定し、
  # 更新時はgo/Dockerfile・Dockerfile.devと揃えて変更する。
  DBMATE_VERSION: "v2.33.0"
  DBMATE_SHA256: "dfd4027141b6e4357158099bdfe6c02b286af70f8e49057937744cf80b38ea1c"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # `Check sqlc generate` と `Check goimports` を `Check templ generate` より
      # 前に置くのは、同ステップの `make templ-generate` がツリー全体に `goimports -w .`
      # を実行するため。後ろに置くと、報告すべきドリフトが先に修復された状態で
      # どちらのチェックも通ってしまう。
      #
      # どちらのチェックも作業ツリーを書き換えないため (`sqlc diff` と `goimports -l` は
      # 報告するだけ)、`git diff --exit-code` のステップは要らない。
      - name: Check sqlc generate
        run: make sqlc-diff

      - name: Check goimports
        run: make goimports-check

      - name: Check templ generate
        run: |
          make templ-generate
          git diff --exit-code internal/templates/

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.11.4
          working-directory: go
          args: --config=.golangci.yml ./...

      # koryluslintのcommentサブコマンドで、コメント・文字列・日本語を含む行が
      # 日本語テキストのスタイル (半角丸括弧、英数字と日本語の間のスペース) に従っているかを検査する。
      # 既存ファイルを含めて表記の逸脱を検出するため、go/配下の検査対象ファイルを全体モードで走査する。
      - name: 日本語テキストスタイルをチェック
        run: make lint-style

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/wikino_test?sslmode=disable
      WIKINO_PORT: "4004"
      WIKINO_DOMAIN: "test.example.com"
      WIKINO_COOKIE_DOMAIN: ".test.example.com"
      WIKINO_SESSION_SECURE: "false"
      WIKINO_SESSION_HTTPONLY: "true"
      WIKINO_RAILS_APP_URL: "http://localhost:3000"
      WIKINO_DISABLE_RATE_LIMIT: "false"

    services:
      postgresql:
        image: postgres:18.1
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: wikino_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # cmd/wikinoのbrowse.shのテストは、スクリプト本体のパスワードスクリプト
      # 生成器 (`node -e` のプログラム) をそのまま動かすため、本ジョブはGoと同じく
      # Nodeを必要とする。ランナーのイメージがたまたま持ってはいるが、要求せずに
      # ツールへ依存しているジョブは、イメージの変更で、対象の変更とは無関係な理由に
      # よって落ちる。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Get dependencies
        run: go mod download

      - name: Setup test database
        run: make db-setup-test

      - name: Run tests
        run: make test
        env:
          CI: true

  # このリポジトリのデータベースはいずれもgo/db/schema.sqlをロードして作る
  # ため、マイグレーションファイルのSQLはCIの他のどこでも実行されない。結果を
  # そのファイルへダンプし戻していないマイグレーションは、本番で初めて実行される
  # ことになる。本ジョブはGit管理下のスキーマから作ったデータベースへ
  # マイグレーションを適用し、続くダンプがそれと食い違えば失敗する。
  schema:
    name: Schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      APP_ENV: test
      DATABASE_URL: postgres://postgres@localhost:5432/wikino_test?sslmode=disable

    services:
      postgresql:
        image: postgres:18.1
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: wikino_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # pg_dumpは自分より新しいサーバーのダンプを拒否するが、ランナーの
      # イメージが持つクライアントは上のサービスコンテナのサーバーより古い。
      # サーバーのメジャーバージョンに合わせたクライアントを入れてPATHの先頭に
      # 置き、本ジョブが比較するダンプがGit管理下のファイルと同じpg_dumpの
      # メジャーバージョンで作られるようにする。
      - name: Set up PostgreSQL client
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Set up dbmate
        run: |
          curl -fsSL -o /tmp/dbmate \
            "https://github.com/amacneil/dbmate/releases/download/${DBMATE_VERSION}/dbmate-linux-amd64"
          echo "${DBMATE_SHA256}  /tmp/dbmate" | sha256sum -c -
          sudo install -m 0755 /tmp/dbmate /usr/local/bin/dbmate

      - name: Check migration drift
        run: make db-check-drift

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: make build

      - name: Check binary exists
        run: |
          if [ ! -f bin/wikino ]; then
            echo "ビルドに失敗しました: バイナリが見つかりません"
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: go/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: go/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: make test-js

      - name: Type-check frontend
        run: make typecheck-js
