name: Rails CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "rails/**"
      - ".github/workflows/rails-ci.yml"
      - ".github/workflows/rails-rbi-push.yml"
  pull_request:
    paths:
      - "rails/**"
      - ".github/workflows/rails-ci.yml"
      - ".github/workflows/rails-rbi-push.yml"

jobs:
  zeitwerk:
    name: Zeitwerk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips libvips-dev
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true
          working-directory: rails
      - run: bin/rails zeitwerk:check

  sorbet:
    name: Sorbet
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the PR head branch only for Dependabot runs. The default
          # checkout leaves HEAD detached at the PR merge commit, so pushing
          # from there would land the merge commit on the PR branch. An empty
          # string falls back to the default checkout, keeping human PRs
          # (including ones from forks) on the merge commit.
          #
          # [Ja] Dependabot の実行時だけ PR の head ブランチをチェックアウトする。
          # 既定のチェックアウトは PR の merge commit で detached HEAD になるため、
          # そこから push すると merge commit ごと PR のブランチに載ってしまう。
          # 空文字列は既定のチェックアウトにフォールバックするので、人間の PR
          # (fork からの PR を含む) は merge commit のままになる。
          ref: ${{ github.actor == 'dependabot[bot]' && github.head_ref || '' }}
          # The commands below execute PR-controlled code and dependencies.
          # Persisting checkout credentials would expose even the read-only
          # GITHUB_TOKEN to that code. A separate workflow performs the push.
          #
          # [Ja] 後続のコマンドは PR が制御するコードと依存関係を実行する。
          # checkout の資格情報を永続化すると、読み取り専用の GITHUB_TOKEN
          # であってもそのコードへ露出する。push は別 workflow で実行する。
          persist-credentials: false
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips libvips-dev
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true
          working-directory: rails
      - run: bin/rails sorbet:update
      - name: Prepare RBI patch or fail
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/rbi.patch"

          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          if [ "$GITHUB_ACTOR" != "dependabot[bot]" ]; then
            echo "Error! 未更新のRBIファイルがあるようです。bin/rails sorbet:update を実行して差分をコミットしてください。"
            exit 1
          fi

          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              rails/sorbet/rbi/*.rbi) ;;
              *)
                echo "Error! RBI の自動更新で許可されていないパスが変更されました: $changed_path"
                exit 1
                ;;
            esac
          done < <(
            {
              git diff --no-renames --name-only -z
              git diff --cached --no-renames --name-only -z
              git ls-files --others --exclude-standard -z
            }
          )

          git add -- rails/sorbet/rbi
          if [ -n "$(git diff --name-only)" ] ||
            [ -n "$(git ls-files --others --exclude-standard)" ] ||
            git diff --cached --quiet -- rails/sorbet/rbi; then
            echo "Error! RBI patch に含められない差分が残っています。"
            exit 1
          fi

          git diff --cached --binary --full-index --no-renames -- rails/sorbet/rbi > "$RUNNER_TEMP/rbi.patch"
      - name: Upload RBI patch
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-rbi-patch
          path: ${{ runner.temp }}/rbi.patch
          if-no-files-found: error
          overwrite: true
          retention-days: 1
      - run: bin/srb tc

  standard:
    name: Standard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true
          working-directory: rails
      - run: bin/standardrb

  erb_lint:
    name: ERB Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true
          working-directory: rails
      - run: bin/erb_lint --lint-all

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.16.0
          package-manager-cache: false
      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.3
      - name: Install npm packages
        run: |
          pnpm install
      - name: ESLint check
        run: |
          pnpm eslint .

  rspec:
    name: RSpec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rails
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/wikino_test
      RAILS_ENV: test
      CI: true
    services:
      postgresql:
        image: postgres:18.1
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: wikino_test
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        # Adding a health check via options
        # https://github.community/t5/GitHub-Actions/Github-Actions-services-not-reachable/td-p/30050
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips libvips-dev
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.16.0
          package-manager-cache: false
      - name: Install pnpm
        run: |
          npm install --global pnpm@10.12.3
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
      - run: chrome --version
      - name: Setup Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.4
          bundler-cache: true
          working-directory: rails
      - name: Setup Database
        run: |
          bin/rails db:schema:load
      - name: Precompile assets
        # E2Eテストのために実行する
        run: |
          bin/rails assets:precompile
      - run: bin/rspec
      - name: Upload Capybara screenshot
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: capybara-screenshots
          path: "rails/**/tmp/capybara/"
